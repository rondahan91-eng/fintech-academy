<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinTech Academy</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

<!-- ‏layout.md §16 · 400px ממורכז · אין סרגל עליון · אין ניווט -->
<main class="login">
  <h1 class="login-brand">FinTech Academy</h1>

  <form id="login-form" autocomplete="off">
    <!-- ⚠️ לא required. **הקוד הוא המפתח** — השם כאן רק כדי שהמסך
         ירגיש כמו כניסה ולא כמו פתיחת כספת. ראה doLogin. -->
    <label class="field">
      <span>שם</span>
      <input id="f-name" type="text" autocomplete="off"
             placeholder="השם שלך">
    </label>

    <label class="field">
      <span>קוד</span>
      <!-- מוסתר כברירת מחדל, עם גילוי בלחיצה. הכיתה יושבת צפוף
           ומסך שכן נראה מהכיסא הסמוך. -->
      <span class="field-wrap">
        <input id="f-code" type="password" required inputmode="numeric"
               autocomplete="off" placeholder="שש ספרות">
        <button type="button" id="peek" class="peek"
                aria-label="הצג את הקוד" aria-pressed="false" tabindex="-1">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path id="peek-eye" d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/>
            <circle cx="12" cy="12" r="3.2"/>
            <line id="peek-slash" x1="4" y1="20" x2="20" y2="4" hidden/>
          </svg>
        </button>
      </span>
    </label>

    <!-- §16.3 · 24px שמורים תמיד. אחרת הכפתור קופץ בדיוק כשטעית -->
    <div class="login-error" id="err" role="alert"></div>

    <button class="btn primary login-go" id="go" type="submit">כניסה</button>
  </form>
</main>

<!-- כתובת השרת. תג רגיל ולא מודול — היעדרו הוא 404, לא מוות שקט. -->
<script src="config.js"></script>
<script type="module" src="login.js"></script>
</body>
</html>
