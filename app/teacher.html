<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פאנל המורה · FinTech Academy</title>
<!--
  ══════════════════════════════════════════════════════════════════════
  מה המורה רואה כאן: מי הגיש, במה התקשה, ומה נאמר בשיחה עם אלעד.
  ומה הוא שולט בו: איזה שבוע פתוח לכיתה, ולמי יש חריגה אישית.

  ⛔ **הדף הזה חושף תמלולי שיחות של תלמידים.** הכניסה בסיסמה שנשמרת
     בהגדרות הסקריפט, והאסימון יושב ב-sessionStorage בלבד — סגירת
     הלשונית מנתקת. במחשב כיתה זה ההבדל בין "המורה התחבר" לבין
     "כל מי שיישב כאן אחריו מחובר".

  ⚠️ **אין כאן ציונים.** הטסטים הנסתרים רצים רק אצל המורה, עם
     tools/grade_week.py. העמודה "מצב" מגיעה מלשונית grades אם מילאת
     אותה; אחרת היא ריקה, ובכוונה.
  ══════════════════════════════════════════════════════════════════════
-->
<style>
:root{
  --ink:#16222F; --ink2:#4A5568; --ink3:#8A93A3;
  --bg:#F5F7FB; --card:#FFFFFF; --line:#DCE3EE;
  --primary:#3D6FE5; --accent:#8B5CF6;
  --ok:#15803D; --okbg:#E6F4EB; --warn:#8A6410; --warnbg:#FBF3E2;
  --bad:#B4232B; --badbg:#FBEAEA; --navy:#1E2A38;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); direction:rtl;
  font-family:'Assistant',"Segoe UI",Arial,sans-serif; font-size:15px; line-height:1.55;
}
.top{
  height:56px; display:flex; align-items:center; gap:16px; padding:0 20px;
  background:var(--card); border-bottom:1px solid var(--line);
}
.brand{font-weight:700;color:var(--primary)}
.sep{width:1px;height:20px;background:var(--line)}
.grow{margin-inline-start:auto}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}

/* ── כניסה ── */
.gate{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);
      border-radius:14px;padding:28px}
.gate h1{font-size:21px;margin:0 0 6px}
.gate p{color:var(--ink2);margin:0 0 18px;font-size:14px}
input[type=password],input[type=text]{
  width:100%;padding:11px 13px;font:inherit;border:1px solid var(--line);
  border-radius:9px;background:#fff;color:var(--ink)
}
button{
  font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:999px;
  padding:9px 20px;background:var(--primary);color:#fff
}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.55;cursor:default}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}

/* ── סרגל שבוע ── */
.bar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px
}
.bar b{font-size:17px}
select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}

/* ── טבלה ── */
table{width:100%;border-collapse:collapse;background:var(--card);
      border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
th{background:#F0F3F9;color:var(--ink2);font-size:13px;font-weight:700}
tr:last-child td{border-bottom:0}
tr.row:hover{background:#F7F9FD;cursor:pointer}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.dim{background:#EEF1F6;color:var(--ink3)}
.num{font-family:Consolas,monospace;direction:ltr;display:inline-block}

/* ── כרטיס תלמיד ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
      padding:20px;margin-bottom:16px}
.card h2{font-size:18px;margin:0 0 4px}
.card h3{font-size:14px;color:var(--ink2);margin:18px 0 8px;
         border-bottom:1px solid var(--line);padding-bottom:6px}
.turn{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.who{flex:0 0 74px;font-size:12.5px;font-weight:700;color:var(--ink3);padding-top:3px}
.turn.elad .who{color:var(--primary)}
.bubble{flex:1;background:#F7F9FD;border:1px solid var(--line);border-radius:10px;
        padding:9px 12px;white-space:pre-wrap;font-size:14px}
.turn.elad .bubble{background:#F3F1FD;border-color:#E2DCF8}
pre{background:var(--navy);color:#E8EDF7;border-radius:10px;padding:14px;overflow:auto;
    direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:13px;margin:0}
.muted{color:var(--ink3);font-size:13.5px}
.hide{display:none}
</style>
</head>
<body>

<div class="top">
  <span class="brand">FinTech Academy</span>
  <span class="sep"></span>
  <span>פאנל המורה</span>
  <span class="grow"></span>
  <span id="whoami" class="muted"></span>
  <button type="button" class="sec hide" id="btn-out">יציאה</button>
</div>

<!-- ── שער הכניסה ── -->
<div class="gate" id="gate">
  <h1>כניסה</h1>
  <p>הסיסמה נקבעת בגיליון: FinTech ← קבע סיסמת מורה.</p>
  <form id="gate-form" autocomplete="off">
    <input type="password" id="pass" placeholder="סיסמת מורה" autocomplete="current-password">
    <div class="err" id="gate-err"></div>
    <button type="submit" id="gate-go">כניסה</button>
  </form>
</div>

<!-- ── הפאנל ── -->
<div class="wrap hide" id="panel">
  <div class="bar">
    <b>השבוע הפתוח לכיתה:</b>
    <select id="week-select"></select>
    <button type="button" id="btn-week">פתח שבוע</button>
    <span class="muted" id="week-msg"></span>
    <span class="grow"></span>
    <button type="button" class="sec" id="btn-export">ייצוא טבלת כיתה</button>
    <button type="button" class="sec" id="btn-export-code">ייצוא הגשות</button>
    <button type="button" class="sec" id="btn-reload">רענן</button>
  </div>

  <div id="list"></div>
  <div id="detail"></div>
</div>

<script src="config.js"></script>
<script type="module" src="teacher.js"></script>
</body>
</html>
