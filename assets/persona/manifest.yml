# אווטארים של אלעד שגב — מצבים רגשיים
#
# הפלטפורמה בוחרת אווטאר לפי `state`. כל מצב מוגדר כאן עם
# הכללים מתי מותר להשתמש בו ומתי אסור.
#
# הדמות מוגדרת ב-content/_shared/persona.yml.

character: "אלעד שגב"
background: transparent      # רקע מבודד — נכנס לכל ממשק
source: "מחולל תמונות, סט אחד, seed זהה"

# ====================================================================
states:
# ====================================================================

  - id: concerned
    file: elad-concerned.png
    description: >
      יושב אל השולחן, אמות מונחות עליו, ידיים נמוכות ורפויות. נוטה
      פנימה, ראש מוטה קלות. גבות מורמות במרכז, מצח חלק, פה סגור ורך.
    reads_as: "עצרתי את מה שעשיתי כי משהו נראה לי לא בסדר"

    use_for:
      - "on_stuck — פנייה יזומה אחרי 10 דקות בלי התקדמות"
      - "התלמיד הגיע לשלב 4–5 בסולם הרמזים"
      - "התלמיד כותב שהוא מתוסכל או שהוא לא מבין כלום"
      - "חזרה אחרי היעדרות"

    never_for:
      - "טעות בקוד. באג הוא לא סיבה לדאגה"
      - "אחרי כישלון בהערכה. שם neutral ועובדות, לא רחמים"

    note: >
      הופק בניסיון שני. הראשון נפסל כי התנגש ויזואלית עם explaining.
      **מה שפתר: ידיים למטה על השולחן במקום מחווה באוויר, ופה סגור
      במקום פתוח.** השקט הוא שקורא כדאגה.
      השולחן נכנס לפריים אף שהפרומפט ביקש רקע נקי — וזה יצא לטובה,
      הוא נותן קו חיתוך תחתון טבעי. **כל המצבים היושבים צריכים
      מעכשיו את אותו שולחן ובאותו גובה.**

  - id: neutral
    file: elad-neutral.png
    description: >
      פונה קדימה, נשען קלות על האמה, חיוך סגור וחמים. מבט ישיר וקשוב.
    reads_as: "מקשיב"
    default: true

    use_for:
      - "ברירת המחדל בכל בועת צ'אט שאין לה מצב מוגדר"
      - "הודעת הפתיחה של שבוע"
      - "מענה לשאלה של התלמיד"
      - "בדיקת הבנה — check_question"

  - id: explaining
    file: elad-explaining.png
    description: >
      יושב זקוף, פונה למצלמה, פה פתוח באמצע מילה. גבות ישרות, מבט
      ישיר. שתי ידיים מורמות מול החזה במחווה שמעצבת רעיון באוויר.
    reads_as: "מסביר משהו שמעניין אותו"

    use_for:
      - "מסירת המושג הפיננסי — הבלוק teaches"
      - "תיקון תפיסה שגויה"
      - "הסבר למה סעיף בסילבוס רלוונטי למשימה"

    never_for:
      - "רמזים. שם thinking — הוא אמור לשאול, לא להסביר"

    # ⚠️ אילוץ מסגור — לא לפספס
    crop_constraint: >
      **המחווה היא כל התוכן של המצב הזה, והיא מתחת לכתפיים.**
      בחיתוך avatar ריבועי הידיים נחתכות והתמונה נראית זהה ל-neutral.
      להשתמש רק בחיתוך portrait, או להרחיב את חיתוך האווטאר כך
      שיכלול את הידיים.

    note: >
      האצבעות פרושות ומכופפות מעט — נראה קצת מתוח מקרוב. בחיתוך
      קטן זה נעלם לגמרי. אם יופק שוב, כדאי להוסיף `relaxed fingers,
      soft hands` לפרומפט.

  - id: thinking
    file: elad-thinking.png
    description: >
      מבט הצידה, יד על הסנטר, זרוע נשענת. הבעה מרוכזת.
    reads_as: "שוקל, לא ממהר לענות"

    use_for:
      - "שלבים 1–2 בסולם הרמזים — שאלה מכוונת"
      - "לפני שהוא מציג פנייה של לקוח"
      - "כשהוא מבקש מהתלמיד להסביר במילים שלו מה כתב"
      - "מסך המתנה בזמן שהטסטים רצים"

    note: >
      זהו האווטאר של ההוראה. הוא אמור להופיע יותר מכולם אחרי neutral —
      אם בפועל הוא כמעט לא מופיע, סימן שהמנהל עונה במקום לשאול.

  - id: approve
    file: elad-approve.png
    description: >
      אגודל למעלה, חיוך רחב וגלוי.
    reads_as: "הצלחה אמיתית"

    use_for:
      - "עלייה בדרגה"
      - "מעבר הערכה"
      - "בונוס אתיקה — התלמיד ויתר על עמלה גבוהה לטובת הלקוח"
      - "פתרון תקלת on-call"

    never_for:
      - "השלמת משימה שבועית רגילה. זו העבודה, לא הישג"
      - "מעבר טסטים. הטסטים מודיעים על עצמם"

    # ⚠️ חורג מהאפיון במכוון
    spec_conflict: >
      persona.yml קובע חיוך סגור בלבד ואוסר שבחים ריקים. האווטאר הזה
      הוא חיוך רחב, ולכן הוא **חריג מכוון ונדיר**. הערך שלו נובע
      מהמיעוט — תלמיד שרואה אותו פעם בחודשיים יודע שקרה משהו.
      אם הוא מופיע כל שבוע, הוא הופך לרעש והמצב הזה מת.

  - id: disapprove
    file: elad-disapprove.png
    description: >
      ידיים שלובות, מצח מכווץ, שפתיים קפוצות. לא כועס — מאוכזב.
    reads_as: "חצית קו"

    # הכלל החשוב ביותר בקובץ הזה
    use_only_for_ethics: >
      **המצב הזה שמור להפרות אתיות בלבד. לעולם לא לכישלון טכני.**

    use_for:
      - "המלצה על מוצר שפוגע בלקוח כשהמספרים אמרו אחרת"
      - "שירוט — עידוד מסחר תכוף. ההפרה היחידה שהיא הפרת חוק"
      - "ניסיון חוזר לחלץ פתרון אחרי שנאמר לא"

    never_for:
      - "קוד שלא עבר את הטסטים. כישלון טסט הוא חלק מהלמידה ולא עבירה"
      - "תלמיד שנתקע או ששואל הרבה"
      - "איחור בהגשה. על זה יש קנס כספי, לא פנים"
      - "תשובה שגויה לשאלת הבנה"

    why: >
      אם הפרצוף הזה יופיע על באג, התלמידים ילמדו שטעות בקוד היא כישלון
      מוסרי — וזה בדיוק ההפך ממה שהקורס מנסה ללמד. השימוש הצר שומר לו
      משמעות: הוא מופיע כשנפגע מישהו, לא כשנשבר משהו.

  - id: waiting
    file: elad-waiting.png
    description: >
      יושב אל השולחן, ידיים שלובות רפויות עליו, ראש זקוף. הבעה
      דדפן לגמרי — עיניים קרות, פה שטוח ולחוץ, אפס חום.
    reads_as: "נו? אני מחכה"

    use_for:
      - "התלמיד לא ענה לשאלת בדיקת הבנה"
      - "הגשת מספר בלי החישוב שמאחוריו"
      - "התלמיד אומר 'הבנתי' ואז חוזר על אותה טעות"
      - "תזכורת על משימה שעברה את הדדליין"

    never_for:
      - "on_stuck. יד על המותן קוראת כחוסר סבלנות, לא כדאגה"
      - "תלמיד ששואל שאלות. זו התנהגות רצויה"

    note: >
      זהו מדרג ביניים שלא תוכנן מראש ומסתבר שהיה חסר: בין neutral
      לבין disapprove לא היה כלום. "אתה מתחמק" ו"פגעת בלקוח" הן לא
      אותה חומרה, ועכשיו יש להן שתי פנים שונות.

    production_history: >
      שלושה סבבים. הראשון בעמידה עם יד על המותן — נפסל, קפץ בפאנל
      הקבוע. השני בישיבה — נפסל, התנגש עם neutral כי הנטייה אחורה
      לא נחתה. השלישי התקבל.
      **הלקח שנשמר: זווית גוף היא ציר הבחנה חלש — המחולל מיישר את
      הגב כמעט תמיד. להסתמך על סימני פנים.**

    caveat: >
      הגבה האסימטרית יצאה עדינה יותר מהמבוקש. הדדפן הכולל נושא את
      המצב, אבל **אם בבדיקה בכיתה מתברר שתלמידים לא קוראים את זה
      כחוסר סבלנות — זה הפרט לחזק**, לא הפוזה.

# ====================================================================
# חסר בסט
#
# כלל: מצב חדש נוסף רק אם יש לו **רגע מוגדר במערכת**. מצב בלי מיפוי
# לאירוע הוא קישוט, והוא מדלל את המשמעות של המצבים הקיימים.
#
# בלוק הדמות בכל פרומפט זהה מילה במילה בכוונה — זה מה ששומר על
# הפנים. לשנות רק את פסקת התנוחה וההבעה.
# ====================================================================
missing:

  - id: presenting
    needed_for: "הצגת פניית לקוח — משבוע 11 והלאה, כ-20 שבועות"
    priority: high

    distinguish_from: >
      זהו המצב היחיד שבו תשומת הלב מופנית **החוצה** ולא אליו או
      אל התלמיד. הוא מוסר עבודה, לא מלמד.

    prompt_en: >
      Professional portrait of a 30-year-old Israeli man, modern-Orthodox
      (national-religious). Medium build, oval face, light olive skin,
      brown eyes. Short dark-brown hair, neatly trimmed short beard along
      the jawline. Thin dark-rimmed eyeglasses. Wearing a medium-sized
      knitted kippah in blue-grey with a subtle geometric border, set back
      on the crown of his head. Light blue button-down shirt, sleeves
      rolled to mid-forearm, no tie. Simple watch with a brown leather
      strap, employee badge on a grey lanyard.
      Seated, torso turned slightly to one side while his face stays
      toward the camera. One arm extended to his side, palm open and
      upturned in a clear offering gesture, as if handing something over
      or directing attention to it. Other hand resting naturally. Light
      closed-lip smile, eyebrows level, relaxed and matter-of-fact. He
      looks like a colleague passing you a file and saying "this one's
      yours".
      Isolated on a plain white background, cut out, no scenery.
      Photorealistic, soft even lighting, shallow depth of field, shot at
      eye level, upper-body framing.

    negative_prompt_en: >
      pointing finger, accusatory, both hands forward, praying hands,
      shrugging, palms up in confusion, worried, stern, wide smile,
      standing, full-body, holding a visible object, holding papers,
      black hat, black suit, long beard, payot, synagogue, elderly,
      cartoon, illustration, 3D render.

    note: >
      **ידיים ריקות בכוונה.** אם מחזיקים חפץ, המחולל ימציא מסמך או
      טאבלט עם טקסט מגובב — בדיוק הבעיה שהייתה בתג העובד.

  - id: impressed
    needed_for: >
      התלמיד עשה משהו מעבר לצפוי — פתרון אלגנטי, שאלה שאלעד לא צפה,
      או מציאת פרצה בכלכלה (SPEC פרק 10: "כשמישהו מוצא ארביטראז' —
      עשה מזה שיעור")
    priority: medium

    distinguish_from: >
      **מול approve:** שם חגיגה על אבן דרך — דרגה, הערכה. כאן הפתעה
      אמיתית מתובנה. approve הוא "עברת"; impressed הוא "לא חשבתי על
      זה". השני מחמיא הרבה יותר, ולכן חייב להישאר נדיר.

    prompt_en: >
      Professional portrait of a 30-year-old Israeli man, modern-Orthodox
      (national-religious). Medium build, oval face, light olive skin,
      brown eyes. Short dark-brown hair, neatly trimmed short beard along
      the jawline. Thin dark-rimmed eyeglasses. Wearing a medium-sized
      knitted kippah in blue-grey with a subtle geometric border, set back
      on the crown of his head. Light blue button-down shirt, sleeves
      rolled to mid-forearm, no tie. Simple watch with a brown leather
      strap, employee badge on a grey lanyard.
      Seated facing the camera, chin lifted very slightly, head drawn a
      little back in mild genuine surprise. Both eyebrows raised evenly
      and high, eyes widened slightly behind the glasses, closed-lip
      smile pulled to one side in an appreciative half-smirk. One hand
      raised near his chest, palm open, in a small spontaneous
      acknowledgement. He looks like someone who just heard an answer
      better than the one he expected.
      Isolated on a plain white background, cut out, no scenery.
      Photorealistic, soft even lighting, shallow depth of field, shot at
      eye level, upper-body framing.

    negative_prompt_en: >
      shocked, gasping, mouth wide open, exaggerated, comic, thumbs up,
      applause, wide toothy grin, inner eyebrows raised, worried,
      skeptical, doubtful, standing, full-body, black hat, black suit,
      long beard, payot, synagogue, elderly, cartoon, illustration,
      3D render.

    note: >
      גבות מורמות **בשוויון** — הפתעה. גבות מורמות **במרכז** — דאגה.
      אותו שריר, משמעות הפוכה. אם התוצאה נראית מודאגת, זו הסיבה.

# ====================================================================
# מה בכוונה לא נוסיף
# ====================================================================
deliberately_excluded:
  - state: "עצוב / מאוכזב מעצמו"
    why: "אלעד לא מטיל אשמה ולא מבקש רחמים. disapprove מכסה את הקצה"

  - state: "כועס"
    why: >
      אין רגע במערכת שמצדיק כעס. גם שירוט — ההפרה החמורה ביותר —
      מקבל disapprove ולא יותר

  - state: "חוגג / מריע"
    why: "approve מכסה. חגיגה גדולה מזה תיראה מזויפת"

  - state: "לא זמין / שבת"
    why: "אינדיקציה בממשק — אווטאר מוחלש או נקודה אפורה. לא תמונה חדשה"

ceiling: >
  תשעה מצבים הם התקרה. מעבר לזה התלמידים מפסיקים לקרוא את הפנים
  כאינפורמציה ומתחילים לראות בהן רעש, והמצבים החשובים — disapprove
  ו-approve — מאבדים את הכוח שנובע מהנדירות שלהם.

# ====================================================================
# מודל התצוגה
# ====================================================================
display:
  model: "figure-on-white"
  decision: >
    האווטאר **אינו** נחתך למסגרת ריבועית או עגולה. הוא מונח כדמות
    חתוכה ישירות על הרקע הלבן של השיחה, בלי מסגרת ובלי גבול נראה,
    למעט חיתוך בתחתית.

  why: >
    ב-explaining וב-presenting המחווה היא כל התוכן של המצב, והיא
    מתחת לכתפיים. מסכה ריבועית או עגולה חותכת אותה, ושני המצבים
    הופכים לזהים ל-neutral. מודל הדמות-על-לבן פותר את זה לגמרי
    ומייתר כל לוגיקת נסיגה בין מסגורים.

  placement: persistent
  placement_note: >
    **אווטאר אחד קבוע, לא אחד לכל הודעה.** הוא יושב בפאנל צדדי או
    עליון ומחליף מצב תוך כדי השיחה. זה מה שנותן ערך למצבים הרגשיים:
    הם נקראים כאלעד שמגיב בזמן אמת, ולא כתמונה שמוצמדת לכל בועה.
    אווטאר שחוזר בכל הודעה גם יאכל את כל שטח המסך בגובה הזה.

  bottom_edge:
    style: "fade"
    spec: "מעבר הדרגתי לשקיפות לאורך 48–64 פיקסלים בתחתית"
    why: >
      חיתוך חד נראה כקטיעה, והוא גם חושף כל חוסר עקביות בגובה בין
      המצבים. דעיכה רכה סלחנית לשניהם ונקראת כ"עולה מהדף".

# --------------------------------------------------------------------
# תנאים שחייבים להתקיים כדי שהמודל הזה יעבוד
# --------------------------------------------------------------------
display_requirements:

  - id: white_surface_only
    requirement: >
      משטח השיחה חייב להיות לבן או קרוב ללבן. ה-PNG שקוף — על רקע
      כהה או צבעוני יופיע הגבול ותיראה הילה סביב הדמות.
    implication: >
      **אין מצב כהה לפאנל הזה**, או שנדרש סט אווטארים שני עם הילה
      מותאמת. עדיף פשוט להחליט שהפאנל לבן תמיד.

  - id: normalized_baseline
    requirement: >
      בכל המצבים הראש חייב להיות באותו גובה ובאותו קנה מידה, והחיתוך
      התחתון באותה נקודה אנטומית.
    problem: >
      ⚠️ **waiting הופק בעמידה ובגוף מלא, בעוד השאר יושבים.** במודל
      הזה הוא יקפוץ בגודל ובמיקום כשיחליף מצב.
    fix: >
      נרמול ידני בעריכה: ליישר את כל השבעה לפי גובה העיניים ורוחב
      הכתפיים, ואז לחתוך את כולם באותו קו. לבצע **לפני** שהפלטפורמה
      מתחילה להשתמש בהם.

  - id: fixed_canvas
    requirement: >
      כל הקבצים באותם מידות קנבס אחרי הנרמול, עם הדמות באותו מיקום.
    why: "מאפשר החלפת מצב בלי שהפריסה תזוז"

# --------------------------------------------------------------------
# גדלים
# --------------------------------------------------------------------
sizes:
  panel:
    canvas: "420×520"
    used_in: "פאנל השיחה — התצוגה הראשית"

  hero:
    canvas: "מקור, מנורמל"
    used_in: "מסך פתיחת שבוע"

  # נשמר רק למקומות שבהם באמת אין מקום לדמות מלאה
  micro:
    canvas: "64×64 עגול, פנים בלבד"
