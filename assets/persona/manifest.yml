      אלעד (360) פחות ריפוד. **זה יחס לרוחב, לא לגובה**, והמסגור
      הפורטרטי הקודם היה מכריח `contain` להקטין את הדמות ולהשאיר
      פסים לבנים בצדדים. 656×480 הוא פי 2 של הקופסה.

      **וזה גם מה שהציל את המחוות:** מסגור פורטרטי ברוחב 420 חותך
      את היד המושטת של presenting. במסגור לרוחב היא נכנסת במלואה.

  hero:
    canvas: "מקור, מנורמל"
    used_in: "מסך פתיחת שבוע"

  # נשמר רק למקומות שבהם באמת אין מקום לדמות מלאה
  micro:
    canvas: "64×64 עגול, פנים בלבד"
    used_in: "רשימת הודעות, התראות"
    note: >
      במסגור הזה **רק neutral**. לא לנסות לדחוס מצבים אחרים לעיגול
      של 64 פיקסלים — ההבדל ביניהם לא ייקרא.

