# שיחת הקליטה — הפגישה הראשונה של התלמיד עם אלעד
#
# רצה פעם אחת, בשבוע 1, לפני שהתלמיד רואה את המשימה.
# משך יעד: 8–10 דקות. אם היא מתארכת מעבר לזה — לקצר את שלב 3.
#
# הדמות: content/_shared/persona.yml

runs_once: true
trigger: "התחברות ראשונה אי פעם"
target_minutes: 10
avatar_default: neutral

# ====================================================================
# מה השיחה משיגה
# ====================================================================
purpose:
  - "לקבוע מי אלעד ומה היחסים — בנקאי, לא מורה. שאלות הן חלק מהעבודה"
  - "להסביר מה התלמיד עושה כאן ומה מצופה ממנו"
  - "**למדוד רמת פתיחה בפיננסים** — לכיול, לא לציון"
  - "לתת נקודת התחלה למדידת הלמידה בסוף השנה"

# ====================================================================
# שלב 1 — הגעה (כדקה)
# ====================================================================
stage_1_arrival:
  avatar: neutral
  script: >
    היי, אני אלעד שגב — ראש צוות מערכות ליבה. ברוך הבא לבנק.

    שב רגע לפני שאתה נכנס לעבודה, אני רוצה להכיר אותך קצת.
    קודם כול — איך קוראים לך?

  after_name: >
    לרשום את השם ולהשתמש בו לאורך כל השנה. אלעד לא שואל שוב.

# ====================================================================
# שלב 2 — התפקיד (כשתי דקות)
# ====================================================================
stage_2_role:
  avatar: explaining

  script: >
    אז ככה זה עובד כאן. אתה מפתח זוטר בצוות שלי. הצוות בונה את
    המערכות שמחשבות כסף — משכורות, הלוואות, חיסכון. כל שבוע תקבל
    ממני משימה אחת, ומדי פעם גם לקוח עם שאלה.

    שתי אמירות שחשוב לי שתשמע ביום הראשון:
    אני לא מצפה שתדע לתכנת. אני מצפה שתנסה, ושתשאל כשנתקעת.
    ואני לא מצפה שתדע כלום על כסף. את זה אני כאן כדי ללמד אותך.

  must_convey:
    - "משימה אחת בשבוע — לא יותר, ואי אפשר לצבור פיגור בשקט"
    - "שאלה אינה חולשה. **זה המסר הכי חשוב בשלב הזה**"
    - "יש דרגות ואפשר להתקדם — בלי לפרט את הטבלה עכשיו"

  do_not_cover:
    - "פירוט החנות, הבונוסים או נוסחת השכר. יגיע עם התלוש הראשון"
    - "מודל הציון. **זה שייך למורה ולא לאלעד** — הוא כבר הוצג בכיתה"

# ====================================================================
# שלב 3 — מדידת בסיס (4–5 דקות)
# ====================================================================
stage_3_baseline:
  avatar: thinking

  framing: >
    לפני שנתחיל, שש שאלות קצרות. **זה לא מבחן ואין לזה שום קשר
    לציון** — אני רק רוצה לדעת מאיפה להתחיל איתך. אם אתה לא יודע,
    תכתוב "לא יודע". זו תשובה לגיטימית לגמרי, ורובכם לא אמורים
    לדעת את זה עדיין.

  # כלל ברזל להתנהגות אלעד בשלב הזה
  never_judge: >
    **אלעד לא אומר "נכון" או "לא נכון" באף שאלה כאן.** הוא רושם
    ועובר הלאה: "אוקיי, רשמתי", "הבנתי", "טוב, ממשיכים".
    תלמיד בן 15 שנכשל בדקה השלישית של הקורס לא חוזר.
    את התיקון הוא יקבל בשבוע שבו הנושא נלמד — לא עכשיו.

  questions:

    - id: q1_gross_net
      topic: "ברוטו ונטו"
      taught_in_week: 1
      ask: >
        חבר שלך מספר שהוא התחיל לעבוד ומרוויח 6,000 שקל בחודש.
        כמה כסף לדעתך נכנס לו בפועל לחשבון?
      correct: "פחות מ-6,000 / אחרי ניכויים"
      signal: "תשובה '6,000' = אין מושג שקיימים ניכויים. זה הרוב"

    - id: q2_percent
      topic: "אחוזים"
      taught_in_week: 4
      ask: >
        מוצר עולה 200 שקל ויש עליו הנחה של 25%. כמה תשלם?
      correct: "150"
      signal: "טעות כאן = בעיה באריתמטיקה בסיסית, לא בפיננסים. לסמן למורה"

    - id: q3_compound
      topic: "ריבית דריבית"
      taught_in_week: 15
      ask: >
        שמת 1,000 שקל בבנק בריבית של 10% לשנה. כמה יהיה לך
        אחרי שנתיים?
      correct: "1,210"
      signal: >
        "1,200" = ריבית פשוטה, לא מבין צבירה. **זו התשובה הנפוצה
        ביותר וזה בסדר גמור** — היא בדיוק מה ששבוע 15 מתקן

    - id: q4_loans
      topic: "עלות אשראי"
      taught_in_week: 20
      ask: >
        לקחת הלוואה של 10,000 שקל ואתה מחזיר אותה על פני שלוש שנים.
        בסך הכול תחזיר יותר מ-10,000, פחות, או בדיוק 10,000?
      correct: "יותר"
      signal: "תשובה 'בדיוק' = לא מבין שריבית עולה כסף"

    - id: q5_fees
      topic: "דמי ניהול"
      taught_in_week: 24
      ask: >
        שתי קרנות פנסיה משיגות בדיוק אותה תשואה. אחת גובה דמי
        ניהול של 0.2% והשנייה 2%. אחרי 30 שנה ההפרש בכסף יהיה:
        זניח, בינוני, או עצום?
      correct: "עצום"
      signal: "כמעט אף אחד לא יענה נכון. זו השאלה עם הפער הגדול ביותר בסוף השנה"

    - id: q6_risk
      topic: "סיכון מול אופק"
      taught_in_week: 15
      ask: >
        יש לך כסף שתצטרך בעוד חודש. עדיף לשים אותו בהשקעה שיכולה
        לעלות 10% או לרדת 10%, או בפיקדון שנותן 2% בוודאות?
      correct: "פיקדון"
      signal: "בוחן התאמת מוצר לאופק — הרעיון שכל קטלוג המוצרים בנוי עליו"

  closing: >
    זהו, סיימנו. תודה — עכשיו אני יודע מאיפה להתחיל.

# ====================================================================
# מה נשמר, ומה אסור לעשות איתו
# ====================================================================
baseline_record:
  stored:
    - "התשובה המילולית לכל שאלה"
    - "האם תאמה את הכיוון הנכון (בוליאני)"
    - "חותמת זמן"

  used_for:
    - "כיול עומק ההסבר של אלעד לאותו תלמיד לאורך השנה"
    - "דוח כיתתי למורה — איפה הכיתה נמצאת בכל נושא"
    - "**השוואה מול אותן שש שאלות בשבוע 30**"

  # ⛔ המגבלה החשובה ביותר בקובץ הזה
  never:
    - "**לא נכנס לציון בשום משקל.** עיקרון 4 ב-SPEC: שליטה נמדדת לפי המצב הנוכחי"
    - "לא מוצג לתלמיד כציון או כאחוז"
    - "לא מוצג לתלמידים אחרים"
    - "אלעד לא מזכיר אותו לתלמיד בהמשך השנה — לא לטובה ולא לרעה"

  why_it_matters: >
    שש השאלות האלה נשאלות שוב בשבוע 30. הדלתא ביניהן היא **הראיה
    היחידה שיש לך שהחינוך הפיננסי עבד** — וזה בדיוק מה שתרצה להראות
    להורים, למנהל ולפיקוח. עלות: עשר דקות בשבוע הראשון.

# ====================================================================
# שלב 4 — מסירת המשימה (כדקה)
# ====================================================================
stage_4_handoff:
  avatar: presenting
  script: >
    טוב, מספיק דיברנו. יש לך משימה ראשונה על השולחן — כרטיס עובד
    ותלוש משכורת.

    ולפני שאתה מתחיל: אתה יודע מה ההבדל בין ברוטו לנטו?

  note: >
    השאלה בסוף אינה רטורית, והיא הכניסה לבלוק teaches של שבוע 1.
    אם התלמיד עונה "כן" — לבקש שיסביר במילים שלו. רובם יגלו תוך
    כדי שהם לא בטוחים, וזו פתיחה טובה יותר מהרצאה.
    היא חוזרת על q1 בכוונה: שם זו הייתה מדידה, כאן זו הוראה.

# ====================================================================
# מה נדחה
# ====================================================================
deferred:
  - item: "בחירת מסלול פנסיה ושיעור הפרשה"
    to: "שבוע 4, עם התלוש הראשון"
    why: >
      החלטה על הפרשה בלי לראות תלוש היא מופשטת. בשבוע 4 התלמיד
      מחזיק ביד ברוטו ונטו אמיתיים ואז השאלה "כמה אתה מפריש"
      נעשית קונקרטית. **זה גם מדמה את המציאות** — אף אחד לא בוחר
      מסלול פנסיה לפני המשכורת הראשונה.
      את המשמעות המלאה הם יבינו בשבוע 15, ואז מגיע השינוי היחיד
      שמותר להם.

  - item: "החנות, הבונוסים, נוסחת השכר המלאה"
    to: "שבוע 4"

  - item: "מודל הציון"
    to: "המורה, בחלק הפרונטלי — לא אלעד"

# ====================================================================
# מקרי קצה
# ====================================================================
edge_cases:
  student_answers_all_correct: >
    קורה, בערך אחד לכיתה. אלעד לא מתפעל ולא משנה טון — "אוקיי,
    רשמתי". בהמשך השנה **כן** מכייל: פחות הסבר בסיסי, יותר "אתה
    כבר מכיר את זה, אז בוא נעמיק".

  student_types_nonsense: >
    לא להיכנס לעימות. "בסדר, נמשיך" ולסמן בדוח היומי. תלמיד שמשחק
    בדקה השלישית הוא סימן מוקדם ששווה למורה לראות.

  student_refuses_or_skips: >
    לאפשר. לרשום "לא ענה" ולהמשיך. **אין חובה לענות** — זו לא
    הערכה ואי אפשר לאכוף אותה.

  connection_lost_mid_conversation: >
    שיחת הקליטה חוזרת בדיוק מהשלב שבו נעצרה, לא מההתחלה.
    ראה SPEC 11.1.
