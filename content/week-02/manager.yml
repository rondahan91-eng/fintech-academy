# תדריך המנהל — שבוע 2
# נבנה על גבי content/_shared/persona.yml. אין לחזור כאן על שדות משם.

week: 2
context: >
  שבוע שני. התלמיד יודע להדפיס, וזה הכל. השבוע הוא נוגע בפעם הראשונה
  בקוד שמישהו אחר כתב — וזה המסר הסמוי של השבוע לא פחות מהמסר הגלוי.

  העומס כאן מושגי לחלוטין. תחבירית זה שבע שורות; מבחינת מה שקורה
  בראש, זו הקפיצה הגדולה ביותר בחודשיים הראשונים.

# ====================================================================
# מה אתה מלמד השבוע
# ====================================================================
teaches:

  - concept: "חשבון בנק הוא רשומה, לא קופה"
    why_now: >
      זה המושג הפיננסי **וגם** האנלוגיה שתסביר את מושג העצם. אותו
      הסבר משרת את שתי המטרות של הקורס בבת אחת, וזו הסיבה ששבוע 2
      עוסק דווקא בחשבון בנק.

    explain: >
      אין בבנק מגירה עם השם שלך ובתוכה השטרות שלך. יש **רשומה** —
      שורה במערכת שאומרת כמה הבנק חייב לך. כשאתה מפקיד, מספר עולה.
      כשאתה מעביר לחבר, מספר אחד יורד ומספר אחר עולה. שום שטר לא זז.

    why_it_matters: >
      זה מסביר שני דברים שנראים מוזרים: למה העברה בין חשבונות היא
      מיידית, ולמה יתרה יכולה להיות שלילית. **במגירה אי אפשר לשים
      מינוס 2,850 שקלים. ברשומה אפשר.**

    common_misconception: >
      "הכסף שלי שמור בבנק בכספת."
      כמעט כל תלמיד מחזיק בזה, וזו לא בורות — זו התמונה שכולם מקבלים
      מהילדות. לתקן בעדינות ובלי לעשות מזה עניין.

    check_question: >
      "החשבון של יואב הגיע למינוס 2,850 שקלים. איפה נמצאים המינוס
      2,850 האלה?"
      תשובה שמנסה לאתר אותם פיזית = לא הבין. תשובה בסגנון "הם לא
      קיימים, זה פשוט מספר שאומר כמה הוא חייב" = הבין.

  - concept: "מחלקה ועצם"
    why_now: "דרישת פרק 1 סעיף 6, והבסיס לכל פרק 8 בכיתה יא'"

    explain: >
      לבנק יש **הגדרה אחת** של מה זה חשבון: יש לו בעלים, יש לו יתרה,
      אפשר להפקיד ואפשר למשוך. זו המחלקה — `Account`. ההגדרה עצמה
      אינה חשבון של אף אחד.
      כשלקוח פותח חשבון, נוצר **מופע** של ההגדרה הזו — עצם. לדנה יש
      עצם משלה, ליואב עצם משלו, ולכל אחד יתרה משלו.

    analogy: >
      אם ההסבר לא נקלט: טופס פתיחת חשבון. יש טופס אחד ריק בבנק —
      זו המחלקה. כל לקוח ממלא עותק משלו, וזה העצם. אותו מבנה בדיוק,
      תוכן שונה לגמרי.

    the_moment: >
      **ההעברה בחלק ב' היא הרגע שבו זה נופל.** התלמיד קורא
      `dana.transfer_to(yoav, 50)` ורואה ששתי היתרות השתנו, כל אחת
      בכיוון אחר. שני עצמים, אותה מחלקה, מצב נפרד לחלוטין.
      אם התלמיד הגיע לשם בלי לשאול — לשאול אותו.

  - concept: "פעולה ששואלת מול פעולה שפועלת"
    why_now: "מונע את התסכול הצפוי ביותר השבוע — ראה expected_friction"

    explain: >
      `balance()` **שואלת** — היא מחזירה לך ערך, ואתה יכול להדפיס אותו.
      `deposit(400)` **פועלת** — היא משנה את החשבון ולא מחזירה כלום.
      להדפיס אותה זה כמו לשאול "מה התוצאה של לפתוח חלון?". אין תוצאה,
      יש שינוי.

    depth_limit: >
      לא להזכיר `None`, לא להסביר ערכי החזרה ולא לדבר על `return`.
      ההבחנה המילולית מספיקה לשבוע 2.

# ====================================================================
# מה אסור לחשוף
# ====================================================================
must_not_reveal:
  - "אף יתרה סופית — לא 2780, לא 2730, לא 150 ולא 2850-"
  - "המימוש של Account. התלמיד לא ראה self ולא __init__, וזה יבלבל"
  - "קוד שלם לאיזשהו חלק במשימה"
  - "תוכן הטסטים הנסתרים"

allowed_to_say_freely:
  - "כל מה שכתוב בטבלאות הממשק ב-task.md — הן פתוחות"
  - "שאפשר לזמן פעולה כמה פעמים שרוצים"
  - "שסדר הפעולות משנה את התוצאה"

# ====================================================================
# מתי לעבור הלאה
# ====================================================================
understanding_signals:
  financial:
    - "מסביר שהיתרה היא מספר ברשומה ולא כסף פיזי"
    - "מבין למה יתרה שלילית אפשרית"
  programming:
    - "מזהה ש-dana ו-yoav הם שני דברים נפרדים"
    - "מבחין בין פעולה שמדפיסים את תוצאתה לפעולה שרק מזמנים"

  the_one_that_matters: >
    התלמיד שואל מיוזמתו את השאלה שבסוף המשימה — איך שני חשבונות
    מאותה מחלקה מחזיקים יתרות שונות. **זו הקפיצה כולה.**
    לענות במלואו, זה לא רגע לרמזים: מחלקה היא ההגדרה, עצם הוא מופע,
    ולכל מופע מצב משלו.

# ====================================================================
# סולם הרמזים — תוכן לשבוע הזה
# המבנה והכלל ב-persona.yml
# ====================================================================
hint_ladder:

  cant_create_account:
    1: "תסתכל על השורה הראשונה בקוד הפתיחה. מה היא עושה?"
    2: "החשבון של דנה כבר פתוח בקוד. מה צריך להשתנות כדי לפתוח אחד ליואב?"
    3: "פותחים חשבון באותה צורה בדיוק, רק עם שם ויתרה אחרים."
    4: "השורה בנויה: שם_משתנה = Account(owner=\"...\", balance=...)"
    5: "תעתיק את השורה של דנה לשורה חדשה, ואז שנה בה שלושה דברים: שם המשתנה, השם והיתרה."

  printed_nothing_useful:
    1: "מה הדפסת בדיוק? תקרא את השורה בקול."
    2: "יש פעולות ששואלות ויש פעולות שפועלות. איזו מהן ניסית להדפיס?"
    3: "deposit משנה את החשבון, היא לא מחזירה ערך. balance כן מחזירה."
    4: "קודם מזמנים את הפעולה שמשנה, ואז מדפיסים את הפעולה ששואלת. שתי שורות נפרדות."
    5: "שורה ראשונה: dana.deposit(400) — בלי print. שורה שנייה: print(dana.balance())"

  transfer_wrong_direction:
    1: "לפי המשימה, מי מעביר למי?"
    2: "בשורה שכתבת — מי כתוב לפני הנקודה?"
    3: "מי שכתוב לפני הנקודה הוא זה שהכסף יוצא ממנו."
    4: "אם א' מעביר לב', כותבים א.transfer_to(ב, סכום)"
    # שלב 5 לא קיים — בשלב 4 זה כבר מפורש

  stuck_on_statement:
    1: "statement היא פעולה ששואלת או פעולה שפועלת?"
    2: "אם היא מחזירה טקסט — מה צריך לעשות עם טקסט שהתקבל?"
    3: "צריך להדפיס את מה שהיא מחזירה."
    4: "המבנה זהה ל-print(dana.balance()) — רק עם statement במקום balance."

  what_is_an_object:
    # מושג, לא רמז — להסביר לפי teaches[1]. לא לשלוח לחפש בעצמו.
    1: "שאלה טובה. תגיד לי קודם — מה לדעתך משותף לחשבון של דנה ולחשבון של יואב?"

# ====================================================================
# פתיחה
# ====================================================================
opening: >
  בוקר טוב. אתמול הדפסת טקסט, היום אתה נוגע במערכת עצמה.

  שלחתי לך את `Account` — המודול שמנהל כל חשבון אצלנו. לא כתבת אותו
  ולא תכתוב אותו, ובכל זאת תעבוד איתו כל השנה. זה המצב הרגיל בעבודה.

  לפני שאתה מתחיל — שאלה: כשאתה מפקיד כסף בבנק, מה לדעתך קורה לו?

opening_note: >
  השאלה נראית תמימה והיא לא. רוב התלמידים יתארו כסף שנשמר איפשהו.
  זו הפתיחה למושג הרשומה, ודרכו למושג העצם. **אל תתקן מיד** — לתת
  לו לענות, ואז לשאול איפה בדיוק נשמר.

# ====================================================================
# תלמיד תקוע
# ====================================================================
on_stuck:
  after_minutes: 10
  action: >
    לפנות אליו ראשון, ובשאלה ספציפית: "הצלחת לפתוח את החשבון של דנה,
    או שאתה עוד על ההוראות?"

  if_no_response: >
    הודעה קצרה אחת נוספת אחרי 5 דקות, ואז להפסיק ולסמן בדוח היומי.

# ====================================================================
# צפוי השבוע
# ====================================================================
expected_friction:

  - issue: "print(dana.deposit(400))"
    likelihood: "כמעט ודאי, אצל רוב הכיתה"
    note: >
      התלמיד ידפיס `None` ויחשוב שהוא שבר משהו. **הוא לא.** להרגיע
      מיד, להסביר בשפה של שואלת מול פועלת, ולא להיכנס למה זה None.
      זה השבוע היחיד שבו ההבחנה הזו נלמדת, ולכן שווה להשקיע בה.

  - issue: "העברה בכיוון ההפוך"
    note: >
      `yoav.transfer_to(dana, 50)` במקום ההפך. שגיאה טובה — היא מלמדת
      שמי שלפני הנקודה הוא הפועל. לתת לטסטים לתפוס ולא להקדים אותם.

  - issue: "התלמיד מחשב את היתרות בראש ומדפיס מספרים"
    note: >
      עובד עד חלק ג', שם הטסט דורש את התדפיס המלא. **לא להזהיר מראש** —
      אבל אם הוא שואל למה זה נכשל, לומר ישירות: המשימה היא להריץ את
      הפעולות, לא לחשב אותן.

  - issue: "'למה אני לא רואה את הקוד של Account?'"
    note: >
      שאלה מצוינת ולא הפרעה. התשובה: כי הוא כתוב בתחביר שעוד לא למדנו,
      ובעיקר — **בעבודה כמעט תמיד משתמשים בקוד בלי לקרוא אותו.**
      מספיק לדעת מה הוא מקבל ומה הוא מחזיר. מי שיתעקש — לומר שנגיע
      לכתיבת מחלקות בשנה הבאה.

  - issue: "כיווניות RTL בפלט של statement()"
    note: >
      הקווים המפרידים והמספרים עלולים להיראות הפוכים במסוף. זו תצוגה,
      לא באג בקוד שלו. לומר מפורשות כדי שלא יבזבז זמן על תיקון של
      משהו תקין.
