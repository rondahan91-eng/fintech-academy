week: 2
title: "מודול הליבה"
sprint: "קליטה"

syllabus:
  chapter: 1
  items: [6, 7, 8, 9]
  hours: 2
  partial:
    - item: 7
      covered: "עבודה עם מחלקה קיימת, תכונות ופעולות"
      not_covered: >
        ההיבט המרחבי הדו-ממדי. הוחלט לוותר על גרפיקה — הסילבוס מציין
        Turtle כדוגמה בלבד. ראה SPEC סעיף 8.6.

python_concepts:
  - "מושג העצם כמופע של מחלקה"
  - "קריאת ממשק של מחלקה קיימת"
  - "יצירת עצם"
  - "זימון פעולה על עצם"
  - "שני מופעים של אותה מחלקה, כל אחד עם מצב משלו"
  - "פעולה שמחזירה ערך מול פעולה שמשנה מצב"

financial_concepts:
  - "חשבון בנק כרשומה, לא כקופה"
  - "יתרה"
  - "הפקדה ומשיכה"
  - "העברה בין חשבונות"
  - "יתרת חובה (אוברדראפט)"

deliverable: "הרצת תנועות על מודול הליבה"
is_star: false
rank_gate: null
depends_on: [1]
xp: 500

# קוד תשתית שהפלטפורמה מזריקה לפני קוד התלמיד
injects:
  - "content/_shared/lib/account.py"

# הנתונים חייבים להיות זהים ב-task.md, ב-tests וב-manager.yml
fixture:
  dana:
    owner: "דנה כהן"
    opening: 2500
    deposit: 400
    withdraw: 120
    after_ops: 2780
    transfer_out: 50
    final: 2730
  yoav:
    owner: "יואב לוי"
    opening: 100
    after_transfer: 150
    withdraw: 3000
    final: -2850
    is_overdrawn: true

notes: >
  השבוע הראשון שבו הפלטפורמה מזריקה קוד תשתית לסביבת ההרצה. התלמיד
  **משתמש** במחלקה ואינו כותב אותה — כתיבת מחלקות היא פרק 8, יא'.
  המימוש אינו מוצג לו; רק הממשק, ב-task.md.

  ההגנה מפני העתקת מספרים: המשימה נותנת **פעולות ולא תוצאות**, והטסטים
  דורשים את הפלט של statement() — שאי אפשר לנחש את ניסוחו.
