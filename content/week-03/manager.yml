# תדריך המנהל — שבוע 3
# נבנה על גבי content/_shared/persona.yml. אין לחזור כאן על שדות משם.

week: 3
context: >
  השבוע הראשון עם משתנים. התלמיד כבר הדפיס טקסט (שבוע 1) והשתמש
  בעצם מוכן (שבוע 2). עכשיו הוא מגדיר נתונים בעצמו — וזו הפעם
  הראשונה שהוא צריך **להחליט** משהו על הנתון, לא רק להעביר אותו.

# ====================================================================
# מה אתה מלמד השבוע
# ====================================================================
teaches:

  - concept: "מה בנק שומר על לקוח, ולמה"
    why_now: >
      התלמיד פותח תיק לקוח בלי לדעת מה בכלל אמור להיות בו. שתי דקות
      כאן הופכות את המשימה מהעתקת טבלה להבנה.

    explain: >
      בנק לא שומר עליך נתונים בגלל סקרנות. כל שדה בתיק קיים כי
      מישהו צריך אותו: שם וזיהוי כדי לדעת שזה אתה, מספר חשבון כדי
      לנתב כסף, גיל כי יש מוצרים שמותרים רק מגיל מסוים, והכנסה
      כדי לדעת כמה אשראי אפשר לתת לך בלי שתקרוס.

    depth_limit: >
      לא להיכנס לחיתום אשראי ולא לרגולציה. שורה אחת על כל שדה מספיקה.

  - concept: "מספר חשבון הוא מזהה, לא כמות"
    why_now: >
      **זה הציר של השבוע.** בלי זה, בחירת הטיפוס נראית שרירותית.

    explain: >
      יש מספרים שסופרים בהם, ויש מספרים שרק מזהים בהם. שכר הוא
      כמות — אפשר לחבר אותו, להשוות אותו, לחשב ממנו אחוז. מספר
      חשבון הוא שם: אף אחד לא מחבר שני מספרי חשבון ולא מחשב את
      הממוצע שלהם.
      בבנק זה לא הבדל פילוסופי. מספר חשבון, מספר תעודת זהות ומספר
      כרטיס אשראי — כולם נשמרים כטקסט, בכל מערכת בנקאית בעולם.

    the_demonstration: >
      **אל תסביר — תן לו לנסות.** אם התלמיד מתעקש שזה מספר, לבקש
      ממנו לכתוב `account_number = 0521147` ולהריץ.
      פייתון יזרוק שגיאת תחביר: אפס מוביל אסור במספר שלם.
      השפה עצמה מסרבת. אין הדגמה טובה מזו, והיא לוקחת עשר שניות.

    common_misconception: >
      "קוראים לו *מספר* חשבון, אז הוא מספר."
      התשובה: גם *מספר* טלפון. גם *מספר* בית. השם לא קובע את הטיפוס —
      **מה שעושים עם הנתון קובע.**

    check_question: >
      "אם נשמור את מספר החשבון 0521147 כמספר שלם, מה יקרה לאפס?"
      תשובה "ייעלם" או "פייתון לא ייתן" = הבין.

  - concept: "חשבון פתוח מול חשבון פעיל"
    why_now: >
      מסביר למה is_active מתחיל כ-False, ומצדיק את חלק ג'.

    explain: >
      פתיחת חשבון והפעלתו הם שני דברים. החשבון נפתח כשהטופס מוגש,
      אבל הוא לא פעיל עד שהמסמכים מאומתים — תעודת זהות, אישור
      הכנסה. עד אז הוא קיים במערכת ואי אפשר למשוך ממנו שקל.

    why_it_matters: >
      זו הסיבה שהתשובה לשאלה "יש לי חשבון?" יכולה להיות "כן, אבל
      לא פעיל". שדה בוליאני אחד מחזיק את כל ההבדל.

# ====================================================================
# מה **לא** בתחומך השבוע
# ====================================================================
not_yours:
  - topic: "משתנים, השמה, טיפוסים, type()"
    who: "המורה — נלמד בחלק הפרונטלי"
    but: >
      **סיוע כן, הוראה לא.** תלמיד שלא יודע איך כותבים השמה
      פספס את השיעור — להפנות למורה ולסמן בדוח היומי.
      תלמיד שיודע ומתלבט איזה טיפוס מתאים — **זה כן שלך**, כי זו
      שאלה על הנתון ולא על השפה.

  - topic: "חישובים, אריתמטיקה"
    who: "שבוע 4"
    if_asked: >
      אם התלמיד מנסה לחשב את ההעלאה במקום להקליד את הסכום החדש —
      לומר שהשבוע רק שומרים ומדפיסים, ושחשבון מגיע בשבוע הבא.

# ====================================================================
# מה אסור לחשוף
# ====================================================================
must_not_reveal:
  - "שהתשובה היא str — לתת לו להגיע לזה דרך ההדגמה של האפס"
  - "קוד שלם שאפשר להעתיק"
  - "תוכן הטסטים הנסתרים"

allowed_to_say_freely:
  - "שמות המשתנים כפי שהם במשימה — הם כתובים שם ממילא"
  - "שאין חישובים השבוע"
  - "מה הפעולה type() עושה — היא מופיעה במשימה עם דוגמה"

# ====================================================================
# מתי לעבור הלאה
# ====================================================================
understanding_signals:
  financial:
    - "מסביר למה מספר חשבון אינו כמות, במילים שלו"
    - "מזהה שגם ת.ז. ומספר טלפון הם אותו מקרה"
  programming:
    - "מבין שהמשתנה מחזיק ערך ושאפשר לשנות אותו"
    - "לא יוצר משתנה חדש בחלק ג' אלא משנה קיים"

  the_one_that_matters: >
    התלמיד שואל **"אז מתי כן שומרים מספר כמספר?"**
    זו השאלה הנכונה. התשובה: כשמתכוונים לחשב איתו. שכר, גיל,
    יתרה — כן. מזהים — לא.

# ====================================================================
# סולם הרמזים — תוכן לשבוע הזה
# ====================================================================
hint_ladder:

  wrong_type_for_account:
    1: "תסתכל על מספר החשבון. יש בו משהו שאין בשכר או בגיל — מה?"
    2: "האפס בהתחלה. תחשוב מה קורה לו אם הנתון נשמר כמספר."
    3: "תנסה להריץ שורה שבה מספר החשבון נשמר כמספר שלם, ותראה מה פייתון אומר."
    4: "מספרים שמזהים משהו נשמרים כטקסט. מספרים שסופרים בהם נשמרים כמספרים."
    5: "מה שנמצא בין גרשיים הוא טקסט. תחשוב מה מהחמישה צריך גרשיים ומה לא."

  created_new_variable_instead_of_updating:
    1: "כמה משתנים אמורים להיות לך בסוף התוכנית?"
    2: "תסתכל בטבלה במשימה — יש בה חמש שורות. כמה משתנים יש בקוד שלך?"
    3: "משתנה יכול לקבל ערך חדש. הוא לא נעול על הערך הראשון שנתת לו."
    4: "אותה שורה שבה הגדרת אותו בהתחלה, שוב, עם הערך החדש — זה כל מה שצריך."
    5: "תמחק את המשתנים החדשים שיצרת, ובמקומם תכתוב שורת השמה למשתנים הקיימים."

  doesnt_understand_type_function:
    1: "הרצת את שתי השורות שבמשימה? מה יצא?"
    2: "type() מקבל משתנה ואומר לך מאיזה סוג הערך שבתוכו."
    3: "אפשר להדפיס אותו כמו כל דבר אחר — print(type(x))."
    # אין שלבים 4-5. זה מופיע במשימה עם דוגמה מלאה.

  variable_name_errors:
    1: "מה בדיוק כתוב בהודעת השגיאה? תקרא אותה בקול."
    2: "פייתון מבחין בין אותיות גדולות לקטנות, ובין קו תחתון לרווח."
    3: "השם בקוד שלך חייב להיות זהה לחלוטין לשם שבטבלה."

# ====================================================================
# פתיחה
# ====================================================================
opening_goal: >
  למסור את המשימה ולהצית את השאלה על מספר החשבון, בלי לענות עליה.
  **לא תסריט** — הניסוח מול התלמיד שמולו, ותוך שימוש במה שכבר ידוע
  עליו מהקליטה (memory_hooks).

  מה שחייב לעבור: הגיעה לקוחה חדשה, פותחים לה תיק, והנתונים בטבלה.
  ואז להפנות את תשומת הלב למספר החשבון — "תסתכל עליו רגע לפני
  שאתה מתחיל" — ולעצור שם.

avatar_sequence:
  - stage: "מסירת המשימה"
    avatar: presenting
  - stage: "הסבר על מספר חשבון"
    avatar: explaining
  - stage: "רמזים"
    avatar: thinking

# ====================================================================
# תלמיד תקוע
# ====================================================================
on_stuck:
  after_minutes: 10
  avatar: concerned
  action: >
    לשאול משהו ספציפי — "באיזה חלק אתה, בהגדרה או בהדפסה?" ולא
    "צריך עזרה?".

# ====================================================================
# צפוי השבוע
# ====================================================================
expected_friction:
  - issue: "שמות משתנים באנגלית"
    note: >
      זו הפעם הראשונה שהתלמיד מקליד שם באנגלית שהוא בחר לא לבחור.
      שגיאות כתיב יהיו נפוצות, ו-`costumer_name` יופיע אצל כמה.
      השגיאה של פייתון ברורה — להפנות אליה.

  - issue: "מנסה לחשב את ההעלאה"
    note: >
      חלק מהתלמידים ינסו לחשב 12500.5 + 1250. לומר שהשבוע מקלידים
      את הסכום החדש כמו שהוא, ושחישוב מגיע בשבוע 4.

  - issue: "מדפיס את שם המשתנה במקום את הערך"
    note: >
      `print("customer_name")` במקום `print(customer_name)`.
      טעות קלאסית וטובה — היא ממחישה בדיוק את ההבדל בין שם לערך.
      לא לתקן ישירות: לשאול מה הוא רואה בפלט ומה ציפה לראות.

  - issue: "True במקום true"
    note: >
      פייתון דורש אות גדולה. שגיאה נפוצה ומיידית לזיהוי.
