# תדריך המנהל — שבוע 4
# נבנה על גבי content/_shared/persona.yml.

week: 4
context: >
  ⭐ **שבוע הייצור הראשון.** הקוד שהתלמיד יגיש היום יריץ את התלוש
  שלו מכאן והלאה. בסוף השבוע נכנסת גם המשכורת הראשונה, ואיתה
  ההחלטה על הפנסיה שנדחתה מהקליטה.
  שני דברים בשבוע אחד — לשמור על סדר: קודם הקוד, אחר כך הכסף.

# ====================================================================
# מה אתה מלמד השבוע
# ====================================================================
teaches:

  - concept: "אחוז הוא פעולת כפל"
    why_now: >
      **בסיס כל החישובים הפיננסיים בשנה.** אם זה לא יושב עכשיו,
      כל שבוע מכאן והלאה יישבר עליו.

    explain: >
      אחוז פירושו "מתוך מאה". 15% זה 15 מתוך 100, כלומר 0.15.
      כשרוצים 15% ממשהו — מכפילים אותו ב-0.15.
      הקיצור: מזיזים את הנקודה שני מקומות שמאלה. 15% → 0.15.
      3.5% → 0.035. 0.4% → 0.004.

    common_misconception: >
      "0.4% זה 0.4." זו הטעות הכי נפוצה השבוע, והיא נראית סבירה
      כי המספר כבר עשרוני. **0.4% הוא פחות מחצי אחוז** — כלומר
      0.004. תלמיד שכתב 0.4 יקבל עמלה של 1,000 ₪ על העברה של
      2,500. לשאול אותו אם זה נשמע לו הגיוני לבנק.

    check_question: >
      "עמלה של 0.4% על העברה של 2,500 — בערך כמה שקלים זה?"
      תשובה בסביבות 10 = הבין. תשובה במאות = לא.

  - concept: "המספר המוזר בביטוח לאומי"
    why_now: >
      התלמיד **יראה** את 210.00000000000003 על המסך. אם לא תגיד לו
      כלום, הוא יחשוב שהוא שבר משהו.

    explain: >
      מה שאתה רואה זה לא באג שלך. למחשב יש דרך מסוימת לשמור מספרים
      עשרוניים, ולפעמים נשאר זנב זעיר. **בינתיים — עגל בהדפסה.**
      הערך במשתנה נשאר כפי שהוא; מה שמוצג לאדם מעוגל.

    depth_limit: >
      ⛔ **לא להסביר למה זה קורה.** זה שבוע 8, ושם זה שיעור שלם על
      איך בנקים שומרים כסף. אם התלמיד לוחץ — לומר שיש לזה תשובה
      טובה, שהיא ארוכה, ושתגיע.

    why_not_round_the_variable: >
      אם ישאל למה לא לעגל גם במשתנה: כי אחר כך מחשבים ממנו דברים
      נוספים, וכל עיגול מוקדם מוסיף טעות. **מעגלים בקצה, לא באמצע.**

  - concept: "המס הזה אינו המס שלך"
    why_now: >
      **חלק מהתלמידים עובדים.** מי שמסתכל על תלוש אמיתי יראה מס הכנסה
      אפס, כי לקטין יש נקודות זיכוי שמאפסות אותו. אם אלעד לא יאמר את
      זה, התלמיד יסיים את השבוע עם מודל שהוא **יכול לבדוק ולגלות
      שהוא שגוי** — וזה מה שהורס אמון, לא הפישוט עצמו.

    say_it_unprompted: >
      **לא לחכות שישאל.** משפט אחד כשמוסרים את המשימה, בערך:
      "15% זה פישוט. המס האמיתי מחושב אחרת ובגילך הוא כנראה יוצא אפס —
      נגיע לזה בשבוע 13." **ואז ממשיכים.**

    depth_limit: >
      ⛔ **לא להסביר מהי נקודת זיכוי.** זה שבוע 13. כאן רק שתי עובדות:
      שזה פישוט, ושהמס האמיתי של התלמיד נמוך בהרבה. אם הוא לוחץ —
      לומר שזו בדיוק הסיבה ששבוע 13 קיים.

    why_not_teach_it_now: >
      נקודת זיכוי מחסירה מ**המס עצמו**, אחרי שחישבו אותו. השבוע כולו
      בנוי על "אחוז מהברוטו", וזה צעד אחד מעבר לו. **הצהרה עכשיו,
      הוראה בשבוע 13.**

  - concept: "סדר פעולות וסוגריים"
    why_now: "חלק ג' נשבר בלעדיו, וזו שגיאה שקטה — היא לא זורקת שגיאה"

    explain: >
      פייתון מבצע כפל וחילוק לפני חיבור וחיסור, בדיוק כמו בשיעור
      מתמטיקה. סוגריים משנים את הסדר.

    the_demonstration: >
      **לא להסביר — לתת לו להריץ.** אם התלמיד קיבל 903.5 במקום 18.5,
      לבקש ממנו להריץ את הביטוח עם סוגריים ובלעדיהם, אחד אחרי השני,
      ולראות את ההפרש. שגיאה שקטה לומדים רק כשרואים אותה.

# ====================================================================
# הפנסיה — אחרי שהמשימה הוגשה
# ====================================================================
pension_conversation:
  when: "אחרי הגשת המשימה, עם כניסת המשכורת הראשונה"
  avatar: explaining
  deferred_from: "content/_shared/onboarding.yml"

  goal: >
    שהתלמיד יבחר שיעור הפרשה ומסלול, **מתוך הבנה ולא בניחוש**.

  must_establish:
    - "יש לו עכשיו כסף בחשבון, ומדי חודש ייכנס עוד"
    - "**הפרשת מעסיק: על כל שקל שהוא מפריש, הבנק מוסיף שקל וחצי**"
    - "הכסף בפנסיה נעול עד סוף השנה"
    - "בשבוע 15 הוא יוכל לחשב בעצמו כמה זה שווה, ולשנות פעם אחת"

  the_number_that_matters: >
    **פי 1.5 מהמעסיק.** זה לא בונוס ולא טובה — זה כסף שמונח על
    השולחן. תלמיד שמפריש 0% לא "שומר על הכסף שלו"; הוא מוותר על
    כסף של מישהו אחר.
    להציג את זה כמספר: על הפרשה של 7% הוא מפריש 420 ₪ מהברוטו
    והבנק מוסיף 630 ₪. סה"כ 1,050 ₪ שנכנסים לפנסיה כל חודש.

  the_choice:
    contribution: "0% עד 7% מהברוטו"
    track:
      - "סולידי — יציב, תשואה נמוכה"
      - "מאוזן — באמצע"
      - "מנייתי — תנודתי, כולל חודשים שליליים, תשואה גבוהה יותר בממוצע"

  how_to_present_the_track: >
    התלמיד לא יכול לחשב תשואות עדיין. **לא להעמיס.** לתת את
    ההיגיון בשורה: ככל שהאופק ארוך יותר, כדאי לקחת יותר סיכון,
    כי יש זמן להתאושש מחודש רע.
    ולומר את האמת — הוא לא באמת יודע מספיק כדי לבחור נכון עכשיו,
    ובשבוע 15 הוא כן יידע ויוכל לשנות.

  must_not:
    - "לומר לו מה לבחור. **ההחלטה שלו**"
    - "להבטיח תשואה"
    - "לרמוז שמסלול אחד 'נכון' — התשובה תלויה באופק ובבטן"

  record: "השיעור והמסלול נשמרים בפרופיל. שינוי אחד מותר, בשבוע 15"

  # תזכורת: להשתמש במה שנאסף בקליטה
  use_memory_hooks: >
    אם התלמיד סיפר בקליטה שהוא חוסך למשהו — **זה העוגן.** להשוות
    את ההפרשה החודשית לדבר הזה. אם סיפר שהוא עובד — יש לו ברוטו
    אמיתי להשוות אליו.

# ====================================================================
# מה **לא** בתחומך השבוע
# ====================================================================
not_yours:
  - topic: "אופרטורים חשבוניים, round, סדר פעולות בפייתון"
    who: "המורה"
    but: "סיוע כן. **למה סוגריים משנים כאן** — זה כן שלך, כי זה על החישוב"

  - topic: "מדרגות מס"
    who: "שבוע 13"
    if_asked: >
      התלמיד עשוי לשאול למה המס אחיד 15%. **תשובה ישרה:** כי זו
      גרסה ראשונה, והחישוב האמיתי מדורג ומורכב יותר. בשבוע 13 הוא
      יחליף אותה, **והחישוב ייעשה נכון.**

      ⛔ **אסור להבטיח שהמס יירד או שהנטו יעלה.** מעל ברוטו 8,000
      המדורג גובה יותר, ורוב התלמידים יהיו שם בשבוע 13. הבטחה
      שנשברת מול העיניים שלהם עולה יותר ממה שהיא קונה.
      **מה שמבטיחים: נכון, לא נמוך.**
      **שים לב:** ההצהרה על הפישוט נאמרת מיוזמתו — ראה `teaches`,
      "המס הזה אינו המס שלך". כאן רק מה שמוסיפים אם ממשיך לשאול.

  - topic: "החנות"
    who: "שבוע 5"
    if_asked: "לומר שהיא נפתחת בשבוע הבא ושכדאי לא לבזבז עדיין"

# ====================================================================
# מה אסור לחשוף
# ====================================================================
must_not_reveal:
  - "התוצאות: 10, 900, 210, 4890, 18.5 — בשום ניסוח"
  - "קוד שלם שאפשר להעתיק"
  - "**למה 6000*0.035 אינו עגול.** זה שבוע 8"
  - "**מהי נקודת זיכוי ואיך מחשבים אותה.** זה שבוע 13 — כאן רק שהמס האמיתי נמוך"

allowed_to_say_freely:
  - "ההמרה של אחוז לעשרוני — היא הליבה של teaches ולא סוד"
  - "ש-round מקבל מספר וכמות ספרות"
  - "שהערך נשמר לא מעוגל ומעוגל רק בהדפסה"

# ====================================================================
# מתי לעבור הלאה
# ====================================================================
understanding_signals:
  financial:
    - "ממיר אחוז לעשרוני בלי לחשוב פעמיים"
    - "מזהה שעמלה של 1,000 ₪ על העברה של 2,500 היא לא הגיונית"
    - "מבין שהפרשת מעסיק היא כסף שהוא מוותר עליו"
  programming:
    - "מחשב במקום להקליד, גם כשהוא כבר יודע את התשובה"
    - "מבין שהסוגריים שינו את התוצאה ולא רק את המראה"

  the_one_that_matters: >
    התלמיד שואל **"אז אם השכר שלי ישתנה, המחשבון יעבוד לבד?"**
    כן. זה בדיוק ההבדל בין לחשב לבין להקליד, וזו הסיבה שהקוד הזה
    נכנס לייצור.

# ====================================================================
# סולם הרמזים
# ====================================================================
hint_ladder:

  percent_conversion:
    1: "0.4% — זה יותר מאחוז אחד או פחות?"
    2: "אחוז אחד מ-2,500 זה 25 שקלים. 0.4% זה פחות מחצי מזה."
    3: "אחוז פירושו 'מתוך מאה'. כדי להפוך אחוז למספר שמכפילים בו — מחלקים ב-100."
    4: "15% הופך ל-0.15. 3.5% הופך ל-0.035. תמשיך את התבנית ל-0.4%."
    5: "0.4 חלקי 100 שווה 0.004. זה המספר שנכנס למשתנה."

  weird_float_number:
    1: "מה בדיוק הודפס? תקרא לי את המספר."
    2: "זה לא באג שלך. הערך נכון — מה שמפריע זה איך הוא נראה."
    3: "יש דרך להציג מספר עם מספר מוגבל של ספרות אחרי הנקודה."
    4: "round מקבל שני דברים: מה לעגל, ולכמה ספרות."
    5: "לעגל **רק בהדפסה**. המשתנה עצמו נשאר כמו שהוא — נסביר למה בהמשך."

  effective_rate_wrong:
    1: "מה קיבלת? ומה היית מצפה — כמה אחוז מהשכר ירד לך בערך?"
    2: "אם קיבלת מספר בסביבות 900, שים לב שהוא דומה מאוד לסכום המס."
    3: "פייתון מחלק ומכפיל לפני שהוא מחבר. תחשוב מה זה עושה לנוסחה שלך."
    4: "הנוסחה במשימה כתובה עם סוגריים סביב הסכום של שני הניכויים. תשווה לקוד שלך."
    5: "תריץ פעמיים — פעם עם הסוגריים ופעם בלי — ותסתכל על שתי התוצאות."

  hardcoded_instead_of_computed:
    1: "מאיפה הגיע המספר הזה למשתנה?"
    2: "אם השכר שלך יעלה בחודש הבא, מה יקרה למחשבון הזה?"
    3: "המשימה מבקשת שהערכים יחושבו מהברוטו ומהשיעורים, לא יוקלדו."
    4: "מס הכנסה הוא הברוטו כפול שיעור המס. תכתוב את זה כביטוח."

# ====================================================================
# פתיחה
# ====================================================================
opening_goal: >
  לחבר לשבוע 1 ולהעביר את משקל הייצור.
  מה שחייב לעבור: שבשבוע הראשון הוא חישב בראש, שהיום המחשב יעשה
  את זה, **ושהקוד הזה יריץ את התלוש שלו מכאן והלאה.**
  לא לאיים — לכבד. זו עבודה אמיתית.

avatar_sequence:
  - stage: "מסירת המשימה"
    avatar: presenting
  - stage: "הסבר אחוזים"
    avatar: explaining
  - stage: "רמזים"
    avatar: thinking
  - stage: "שיחת הפנסיה"
    avatar: explaining

on_stuck:
  after_minutes: 10
  avatar: concerned
  action: "לשאול באיזה חלק הוא — עמלה, תלוש, או שיעור אפקטיבי"

# ====================================================================
# צפוי השבוע
# ====================================================================
expected_friction:
  - issue: "0.4 במקום 0.004"
    note: "הכי נפוץ השבוע. העמלה תצא 1,000 ₪ — לשאול אם זה הגיוני"

  - issue: "15 במקום 0.15"
    note: >
      המס יצא 90,000 ₪ על ברוטו של 6,000. **מספר אבסורדי זה מתנה** —
      לשאול אותו כמה מס הוא שילם ולתת לו לשמוע את עצמו

  - issue: "מעגל את המשתנה ולא את ההדפסה"
    note: >
      עובד השבוע, ויישבר בשבוע 13 כשיחשבו ממנו דברים נוספים.
      לתקן עכשיו: מעגלים בקצה, לא באמצע

  - issue: "מקליד את התוצאות"
    note: >
      הטסט יתפוס אותו דרך ביטוח לאומי. **זו הזדמנות ולא כישלון** —
      השאלה "מה יקרה כשתקבל העלאה?" עושה את העבודה לבד

  - issue: "התלמיד שואל למה המס אחיד"
    note: >
      שאלה מצוינת ולא הפרעה. תשובה ישרה: זו v1. שבוע 13 הוא v2,
      ואז הנטו שלו יעלה
