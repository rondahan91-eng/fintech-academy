notes: >
  הפעם הראשונה שהמחשב מחשב במקום התלמיד — הבטחה שניתנה לו בשבוע 1.

  **המס כאן אחיד 15%, לא מדורג.** זו הפשטה מוצהרת, וזו הסיבה שהמספרים
  זהים לאלה של שבוע 1. בשבוע 13 התלמיד יחליף אותה במדרגות אמיתיות.

  ⚠️ **אל תבטיח שהנטו יעלה. לרוב התלמידים הוא יירד.**
  על ברוטו 6,000 המדורג אכן נמוך יותר — 800 מול 900. אבל **נקודת
  האיזון היא 8,000 בדיוק**, ומעליה המדורג גובה יותר. תלמיד D1 עם
  ארבע משימות מלאות כבר ב-9,200, ובשבוע 13 הוא D2 ב-11,200 ומעלה —
  שם המדורג עולה לו כ-512 ₪. ראה SPEC §3.4 ו-week-13/manager.yml.

  **מה כן להבטיח:** שהחישוב ייעשה **נכון**. זה מתקיים תמיד.

  **"מוצהרת" פירושה שנאמרת לתלמיד, לא שנרשמת כאן.** אלעד אומר מיוזמתו
  שזה פישוט ושהמס האמיתי בגילו כנראה אפס — ראה `manager.yml`,
  `teaches` → "המס הזה אינו המס שלך". חלק מהתלמידים עובדים ורואים
  תלוש אמיתי; **הערה פנימית שאיש אינו שומע אינה הצהרה.**

  **6000 * 0.035 = 210.00000000000003** — ארטיפקט float אמיתי שהתלמיד
  יראה. הוא מנמק את round() באופן טבעי, והוא הזרע לשבוע 8. אלעד לא
  מסביר אותו כאן, רק אומר שיש לזה סיבה ושנגיע אליה.
