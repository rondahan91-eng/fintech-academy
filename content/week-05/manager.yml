# תדריך המנהל — שבוע 5
# נבנה על גבי content/_shared/persona.yml.

week: 5
context: >
  השבוע הראשון שבו חלוקה **לא** מחזירה עשרוני. בשבוע שעבר הנטו יצא
  4890.0 וזה היה תקין; כאן אי אפשר לחייב לקוח בשליש שקל, ולכן נכנסים
  שני אופרטורים חדשים. הנושא נראה טכני והוא לא: השארית היא מה שהופך
  פריסה לבעיה אמיתית בבנק.

# ====================================================================
# מה אתה מלמד השבוע
# ====================================================================
teaches:

  - concept: "שני אופרטורים, לא אחד"
    why_now: >
      **הציר של השבוע.** בלי ההבחנה הזאת התלמיד חושב שהוא פתר, והוא
      פתר משהו אחר.

    explain: >
      ‏/ מחלק ומחזיר עשרוני תמיד, גם כשהחלוקה יפה.
      ‏// מחזיר כמה פעמים נכנס, בלי השארית, כמספר שלם.
      ‏% מחזיר מה שנשאר.
      ‏17 חלקי 5 הוא 3.4; ‏17 // 5 הוא 3; ‏17 % 5 הוא 2.

    common_misconception: >
      "‏// זה בעצם עיגול." **לא.** ‏round(4850 / 6) נותן 808, וגם
      ‏4850 // 6 נותן 808 — אותו מספר, ולכן הטעות שורדת. ההבדל הוא
      שעיגול יכול לעלות למעלה ו-// לעולם לא, ושהטיפוס שונה. אם
      התלמיד אומר "זה אותו דבר" — תן לו לנסות 4853 / 6 מול
      4853 // 6 מול round(4853 / 6) ולראות מה קורה. ⚠️ דווקא
      4853: על 4849 העיגול עדיין יורד ל-808 ושום דבר לא נפרד.

    check_question: >
      "‏25 // 4 — כמה יוצא, ולמה לא 6.25?"
      תשובה 6 עם הסבר שהשארית נזרקת = הבין.

  - concept: "שארית היא כסף אמיתי"
    why_now: >
      התלמיד נוטה להתייחס לשארית כשגיאת עיגול. בבנק זה ההפך — היא
      הדבר היחיד שאסור לאבד.

    explain: >
      שני שקלים שנשארו מפריסה לשישה תשלומים לא נעלמים ולא מתחלקים.
      הבנק מוסיף אותם לתשלום הראשון, והסכום הכולל חייב לחזור בדיוק.
      זו הסיבה שחלק ב' מבקש לחשב את הסכום בחזרה: **פתרון בודקים,
      לא מניחים.**

    never_for:
      - "לומר לו מה הסכום אמור לצאת. הוא אמור לגלות שהוא לא סוגר"

  - concept: "אותם אופרטורים, שאלה אחרת"
    why_now: >
      חלק ג' נראה כמו תרגיל נפרד, והוא לא — וזה מה שהופך את השבוע
      משני כללים לשני כלים.

    explain: >
      בחלק א' מפרקים סכום למנות. בחלק ג' מרכיבים יחידה גדולה
      מיחידות קטנות: ‏128745 אגורות הן 1287 שקלים ועוד 45 אגורות.
      בהרחבה יש שימוש שלישי — ספירת כמה פעמים אירוע קורה בתוך טווח.
      אותם שני אופרטורים בשלושתם.

    depth_limit: >
      ⛔ **לא להסביר למה בנקים שומרים אגורות שלמות.** זה שבוע 8. אם
      התלמיד שואל — לומר שיש לזה תשובה טובה, שהיא שווה שיעור שלם,
      ושהיא מגיעה.

# ====================================================================
must_not_reveal:
  - "התוצאות: 808, 2, 810, 1287, 45 — בשום ניסוח"
  - "התוצאות של ההרחבה: 1032, 6, 1038, 2, 1 — גם לא למי שקיבל אותה"
  - "את השורה המלאה שמחשבת את check_total"
  - "שהתשובה לחלק ג' היא // 100 ו-% 100 — זו המסקנה שהוא צריך להסיק"

allowed_to_say_freely:
  - "ש-/ מחזיר עשרוני ו-// מחזיר שלם"
  - "ש-% נקרא 'מודולו' ומחזיר את מה שנשאר"
  - "שבשקל מאה אגורות"
  - "שאסור שהסכום הכולל יצא שונה מסכום הרכישה"

# ====================================================================
hint_ladder:

  wrong_operator:
    1: "מה קיבלת בתשלום הרגיל? תקרא לי את המספר."
    2: "‏808.3333 — אפשר לחייב לקוח בשליש שקל?"
    3: "יש בפייתון אופרטור חלוקה שמחזיר רק את החלק השלם."
    4: "הוא נכתב בשני קווים נטויים במקום אחד."
    5: "‏// הוא המנה השלמה. נסה אותו במקום / ותראה גם מה הטיפוס."

  remainder_lost:
    1: "כמה יוצא התשלום הרגיל כפול מספר התשלומים?"
    2: "וכמה היה סכום הרכישה? מה ההפרש?"
    3: "ההפרש הזה הוא כסף של הלקוח. איפה הוא בקוד שלך?"
    4: "יש אופרטור שמחזיר בדיוק את מה שנשאר אחרי החלוקה השלמה."
    5: "‏% מחזיר את השארית. היא נוספת לתשלום הראשון."

  check_total_wrong:
    1: "מה קיבלת ב-check_total, ומה היית מצפה?"
    2: "כמה תשלומים רגילים יש בפועל — שישה, או חמישה ועוד אחד גדול?"
    3: "התשלום הראשון כבר כולל את השארית, אז הוא נספר בנפרד."

  agorot_stuck:
    1: "כמה אגורות יש בשקל אחד?"
    2: "אם יש לך 128745 אגורות — כמה פעמים נכנסים בהן 100?"
    3: "וזה בדיוק אותם שני אופרטורים מחלק א'."

# ====================================================================
opening_goal: >
  השבוע אתה פורס קניות לתשלומים. החלוקה הרגילה לא תעזור לך כאן —
  אי אפשר לחייב לקוח בשליש שקל. יש שני אופרטורים שעושים בדיוק את
  מה שצריך, ובדף המשימה יש דוגמה להריץ לפני שמתחילים. תתחיל, נדבר
  תוך כדי.

avatar_sequence:
  - "presenting — מסירת המשימה"
  - "explaining — ההבדל בין / ל-//"
  - "concerned — נתקע על השארית"
  - "approve — הסכום סגר"

# ====================================================================
expected_friction:
  - issue: "משתמש ב-/ ומעגל"
    note: >
      מקבל את המספר הנכון בדרך הלא נכונה, והבדיקה הנסתרת תופסת אותו
      דרך הטיפוס. **זו הזדמנות ולא כישלון** — השאלה "מה יקרה עם
      4853?" עושה את העבודה לבד

  - issue: "מחשב שארית כהפרש במקום ב-%"
    note: >
      ‏purchase_amount - payment * payments_count עובד, והוא גם לא
      שגוי. לקבל אותו, ואז להראות ש-% עושה את זה בשורה אחת

  - issue: "מנסה להשתמש ב-if על השארית"
    note: >
      "אם השארית גדולה מאפס אז..." — ‏if עוד לא נלמד, והמשימה לא
      צריכה אותו. לומר שזה מגיע בשבוע 11 ושכאן מוסיפים את השארית
      תמיד, גם כשהיא אפס

  - issue: "check_total יוצא גדול בתשלום אחד"
    note: >
      ספר את התשלום הראשון פעמיים. הכי מהיר לתת לו לכתוב על נייר
      כמה תשלומים יש ומה הסכום של כל אחד
