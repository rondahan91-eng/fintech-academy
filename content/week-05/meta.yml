notes: >
  **השבוע הראשון שבו חלוקה אינה מחזירה עשרוני.** בשבוע 4 הנטו יצא
  4890.0 וזה היה בסדר; כאן 4850 חלקי 6 חייב להחזיר שלם, כי אי אפשר
  לחייב לקוח בשליש שקל.

  ⚠️ **הטעות המרכזית היא / במקום //, והיא קשה לאבחון.** ‏808.3333
  נראה לתלמיד כמו תשובה. כל בדיקה על payment שואלת גם
  isinstance(value, int), וזה תופס את / ואת round(x, 2) — שניהם
  מחזירים float.

  ⚠️ **ומה שהטסטים לא תופסים, ונבדק:** ‏int(x / y) ו-round(x / y - 0.5)
  מחזירים int עם הערך הנכון, ועל הקלט הזה הם פשוט נכונים. אין
  בדיקה שתבדיל ביניהם ל-// כשהקלט קבוע. **זה עובר לרובריקה**, שם
  זה כתוב כקריטריון ראשון, עם הדרך להראות לתלמיד: להריץ
  4853 // 6 מול round(4853 / 6) ולראות את התוצאות נפרדות —
  808 מול 809. ⚠️ **לא 4849 ולא 4850**: שם שניהם מחזירים 808,
  וההדגמה מוכיחה את ההפך. צריך שארית מעל חצי.

  **השארית אינה פרט טכני אלא השיעור.** שני שקלים שאי אפשר לחלק
  לשישה הם בדיוק מה שהופך פריסה לבעיה אמיתית בבנק, והדרישה
  ש-check_total יחזור ל-4850 היא שמלמדת שפתרון בודקים ולא מניחים.

  **חלק ג' הוא אותם אופרטורים בשימוש הפוך.** בחלק א' מפרקים סכום
  למנות; כאן מרכיבים יחידה גדולה מיחידות קטנות. תלמיד שמבין למה
  שניהם אותו דבר הבין את השבוע. זה גם הזרע לשבוע 8 — למה בנקים
  שומרים כסף באגורות שלמות ולא ב-float.

  **אין תנאים השבוע.** ‏if מגיע בשבוע 11, ודף המשימה אומר את זה
  במפורש כדי שתלמיד לא ינסה "אם השארית גדולה מאפס".

  ⚠️ **בהרחבה יש שבעה תשלומים ולא שמונה, וזה לא שרירותי.** עמלת
  הטיפול בחלק ג' נגבית על כל שלושה תשלומים, ו-8 // 3 ו-8 % 3
  מחזירים **שניהם 2**. כלומר תלמיד שחישב את אותו דבר פעמיים היה
  עובר את הבדיקה שכל תפקידה להבדיל בין שני האופרטורים. ‏7 נותן
  2 ו-1, והטעות נופלת. נבדק בבדיקה שלילית: ארבעה פתרונות שגויים,
  ארבעה כישלונות.
