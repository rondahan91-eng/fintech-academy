# תדריך המנהל — שבוע 6
# נבנה על גבי content/_shared/persona.yml.

week: 6
context: >
  השבוע שבו הכסף מתחיל לעבוד לבד. עד עכשיו כל חישוב היה פעולה אחת
  על סכום אחד; כאן אותה קרן נותנת שתי תשובות שונות, ריבית פשוטה
  וריבית דריבית, וההפרש ביניהן הוא כל השיעור. **הפונקציות המובנות
  אינן הנושא — הן הכלי.**

# ====================================================================
# מה אתה מלמד השבוע
# ====================================================================
teaches:

  - concept: "ריבית פשוטה מול ריבית דריבית"
    why_now: >
      **הציר של השבוע, והמושג הפיננסי הכי שימושי שהם יפגשו השנה.**
      הוא עובד לשני הכיוונים: חיסכון שגדל, וחוב שגדל.

    explain: >
      ריבית פשוטה מחושבת כל שנה על הקרן המקורית בלבד.
      בריבית דריבית, הריבית של כל שנה נכנסת לקרן, ובשנה הבאה גם היא
      נושאת ריבית. אותו אחוז, אותו זמן — סכום אחר.

    analogy: >
      אם ההסבר לא נקלט: בריבית פשוטה אתה מקבל כל שנה אותו שכר. בדריבית
      אתה מקבל כל שנה העלאה שמחושבת על השכר שכבר הועלה.

    common_misconception: >
      "הפרש של 90 שקל בארבע שנים, אז זה לא משנה." **זו בדיוק הנקודה
      ללחוץ עליה** — אותו חישוב על 20 שנה, או על הלוואה, נראה אחרת
      לגמרי. מותר לך לומר שהפער גדל ככל שהזמן ארוך יותר. **אסור לך
      להריץ בשבילו מספרים של משימה אחרת.**

    check_question: >
      "איזה סכום יוצא גדול יותר, ולמה דווקא הוא?"
      תשובה שמסבירה שהריבית נכנסת לקרן = הבין.

  - concept: "תקרה ורצפה בלי תנאי"
    why_now: >
      הם ירצו if, ו-if מגיע בשבוע 11. זו ההזדמנות להראות ש**לא כל
      הגבלה צריכה תנאי** — וזו גם הדרך שבה זה נכתב בקוד אמיתי.

    explain: >
      ‏min(סכום, תקרה) לא יחזיר לעולם יותר מהתקרה.
      ‏max(סכום, 0) לא יחזיר לעולם פחות מאפס.
      שתי שורות שעושות מה שתלמיד מנסה לעשות בארבע שורות של if.

    never_for:
      - "ללמד if. גם לא 'רק כדי להראות'. זה שבוע 11, והמשימה לא צריכה אותו"

  - concept: "המספר המוזר בחלק א'"
    why_now: >
      ‏12000 * 0.035 * 4 מחזיר 1680.0000000000002, והם יראו את זה.
      אם לא תיתן לזה מענה, תלמיד יבזבז עשר דקות על חיפוש באג שאינו שלו.

    explain: >
      לומר לו במפורש: **זה לא באג שלך, הקוד שלך נכון.** למחשב יש דרך
      מסוימת לשמור מספרים עשרוניים, ולפעמים נשאר זנב זעיר. בגלל זה
      מעגלים בהדפסה.

    depth_limit: >
      ⛔ **לא להסביר איך float עובד ולא לדבר על ביטים.** זה שבוע 8,
      שיעור שלם. לומר שיש לזה תשובה אמיתית, שהיא מגיעה, ולחזור לעבודה.

# --------------------------------------------------------------------
# מה **לא** בתחומך השבוע
# --------------------------------------------------------------------
not_yours:
  - topic: "התחביר של pow, min, max, divmod"
    who: "המורה — נלמד בחלק הפרונטלי"
    but: >
      **סיוע כן, הוראה לא.** אם הוא תקוע על הסדר של הארגומנטים —
      סולם הרמזים. אם הוא לא יודע מה זו פונקציה מובנית בכלל, זה סימן
      שהוא פספס את השיעור: להפנות למורה ולסמן בדוח היומי.

# ====================================================================
must_not_reveal:
  - "התוצאות: 1680, 13680, 13770.28, 1770.28, 90.28, 270, 28 — בשום ניסוח"
  - "את השורה המלאה שמחשבת את compound_total"
  - "שהתשובה לחלק ג' היא min ו-max — זו המסקנה שהוא צריך להסיק מהמשפט 'אין if השבוע'"
  - "התוצאות של ההרחבה: 11000, 2500, 10239.91, 2239.91, 14.8, 28.0"

allowed_to_say_freely:
  - "ש-pow(בסיס, מעריך) מחזיר בסיס בחזקת מעריך, ושאפשר לנסות אותו על 2 ו-3"
  - "ש-abs מחזיר את הגודל בלי הסימן"
  - "ש-divmod מחזירה שתי תוצאות בבת אחת"
  - "שריבית דריבית מחושבת על הקרן אחרי שהריבית נכנסה אליה"
  - "שהזנב המוזר בעשרוני אינו טעות שלו"

# ====================================================================
hint_ladder:

  power_on_rate_only:
    1: "מה קיבלת ב-compound_total? תקרא לי את המספר."
    2: "הוא יצא קטן מהקרן. מה המשמעות של זה — הלקוח הפסיד כסף?"
    3: "מה בדיוק העלית בחזקה? תקרא לי את הביטוי."
    4: "אחרי שנה אחת, כמה יש ללקוח ביחס למה שהיה לו — קצת יותר מהכול, או רק האחוז?"
    5: "החזקה פועלת על הסכום שאחרי שנה: 1 ועוד השיעור."

  wants_if:
    1: "מה אתה רוצה שיקרה כשהריבית גדולה מהתקרה?"
    2: "ומה אתה רוצה שיקרה כשהיא קטנה ממנה? שים לב שבשני המקרים אתה בוחר אחד משניים."
    3: "יש פונקציה שמקבלת שני מספרים ומחזירה אחד מהם."
    4: "שתיים כאלה, אחת לכל כיוון. אחת מהן היא בדיוק 'תקרה'."
    5: "min מחזיר את הקטן, max את הגדול. תקרה היא min מול התקרה."

  divmod_confusion:
    1: "כמה תוצאות אתה צריך — אחת או שתיים?"
    2: "ומה עשית בשבוע שעבר כדי לקבל אותן? באילו שני אופרטורים?"
    3: "divmod מחזירה את שתיהן יחד, ולכן משמאל לסימן השוויון יש שני שמות."
    4: "הסדר קבוע: קודם המנה השלמה, אחריה השארית."

  weird_decimal:
    1: "תקרא לי את המספר שיצא לך לפני העיגול."
    2: "הקוד שלך נכון. למחשב יש דרך מסוימת לשמור עשרוניים, ולפעמים נשאר זנב."
    3: "זו בדיוק הסיבה שמעגלים בהדפסה. יש לזה שיעור שלם, והוא מגיע."

# ====================================================================
opening_goal: >
  לקוח הפקיד אצלנו כסף וארבע שנים לא נגע בו. השבוע תחשב כמה יש לו
  עכשיו — ותגלה שיש לזה שתי תשובות שונות. ההפרש ביניהן הוא כל
  העניין. בדף המשימה יש דוגמה קטנה להריץ לפני שמתחילים.

avatar_sequence:
  - "presenting — מסירת המשימה"
  - "explaining — ההבדל בין שתי הריביות"
  - "concerned — החזקה על השיעור לבדו"
  - "impressed — ההפרש סגר"

# ====================================================================
expected_friction:
  - issue: "מעלה בחזקה את השיעור לבדו"
    note: >
      ‏pow(0.035, 4) נותן מספר זעיר, והסכום יוצא קטן מהקרן. **הבדיקה
      הגלויה תופסת את זה במפורש** ואומרת לו להסתכל על ה-1. זו הטעות
      הנפוצה ביותר השבוע

  - issue: "מנסה if על התקרה"
    note: >
      "אם הריבית גדולה מ-1500 אז..." — if מגיע בשבוע 11. סולם הרמזים
      wants_if מוביל אותו ל-min בלי למסור אותו

  - issue: "נבהל מ-1680.0000000000002"
    note: >
      **זו לא תקלה וזו לא טעות שלו.** לומר את זה מיד ובפירוש, ולחזור
      לעבודה. ההסבר המלא הוא שבוע 8

  - issue: "מחשב את ההפרש בסדר ההפוך ומקבל מינוס"
    note: >
      בדיוק בשביל זה יש abs. לשאול אותו אם "הפרש" הוא כמה, או מי
      גדול ממי
