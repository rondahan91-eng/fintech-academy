notes: >
  **השבוע שבו הכסף מתחיל לעבוד לבד.** עד כה כל חישוב היה פעולה אחת
  על סכום אחד. כאן אותה קרן נותנת שתי תשובות שונות — 1,680 בריבית
  פשוטה ו-1,770.28 בדריבית — וההפרש הוא כל השיעור. ‏pow אינו טריק
  תחבירי; הוא מה שהופך "אותו אחוז" לסכום אחר.

  ⚠️ **‏pow ו-** מחזירים בדיוק את אותו float, ונבדק.** אין בדיקה
  שתבדיל ביניהם, ולכן הדרישה ל-pow היא **קריטריון ברובריקה** ולא
  טסט. אותו מבנה כמו // מול round בשבוע 5.

  ⚠️ **‏min ו-max כאן הם תחליף ל-if, וזה מכוון.** ‏if מגיע רק בשבוע
  11, ותלמיד שרוצה "אם הריבית גדולה מהתקרה אז..." צריך לראות שיש
  לזה פונקציה. ‏min(ריבית, תקרה) היא תקרה; ‏max(x, 0) היא רצפה.
  זה גם איך שכותבים את זה בקוד אמיתי, לא רק עקיפה.

  ⚠️ **‏simple_interest יוצא 1680.0000000000002, ולא 1680.** זה לא
  באג של התלמיד וזה לא טעות שלו — זו בדיוק הסיבה שבנקים לא שומרים
  כסף ב-float, והשיעור המלא הוא שבוע 8. דף המשימה מפנה אותו
  לאלעד, ואלעד יודע לומר "יש לזה תשובה אמיתית, היא מגיעה". **כל
  הבדיקות על כסף נכתבו עם סובלנות של אגורה אחת** בדיוק מהסיבה הזו.

  ⚠️ **ומה שהבדיקות לא תופסות בהרחבה, ונבדק בבדיקה שלילית:**
  ‏total_deposits = 11000 מוקלד עובר הכול, כי זה בדיוק הסכום של
  הרבעונים הקבועים; ו-better = yield2 עובר, כי התשואה השנייה היא
  במקרה הגדולה וההשוואה ל-max נכונה בשני המקרים. **שניהם ברובריקה.**
  עשר וריאציות שגויות נבדקו, שבע נפלו כנדרש, ושתיים אלה ואחת —
  ‏** במקום pow — עוברות במתכוון.

  ⚠️ **‏sum נדחף להרחבה, ו-random אינו נבדק כלל.** ‏sum בלי רשימות
  מחייב סוגריים פנימיים — ‏sum((a, b, c)) — וזה תחביר שנראה כמו
  שגיאה למי שלא ראה tuple, שמגיע ביא'. בהרחבה זה מוסבר בשורה אחת.
  ‏random דורש import, שאינו בפרק 2 בכלל, וערך אקראי אי אפשר לבדוק
  בלי להפוך את הבדיקה לחסרת ערך — **הוא נלמד פרונטלית בהדגמה חיה
  ולא נדרש בקוד המוגש.** אם תרצה אותו בכל זאת כמשימה, זה שינוי
  למשימת ההרחבה, לא למשימה השבועית.
