# ⚠️ **הקלט הרשמי של המשימה.** ‏app.js מזין אותו ל-stdin של Pyodide
#    כשהתלמיד מריץ בדיקות, והוא גם מה שמופיע בטאב "קלט" בפתיחה.
#    הבודקים המקומיים קוראים אותו מכאן — ראה tools/check_extension.py.
stdin:
  - "דנה לוי"
  - "4200"
  - "15000"
  - "10"
  - "1"
  # שלוש השורות של ההרחבה. ⚠️ **נשלחות לכולם** — תלמיד שלא לקח
  # הרחבה פשוט לא קורא אותן, ו-input() שלו נעצר אחרי החמש.
  - "12000"
  - "21000"
  - "12"

fixture:
  name: "דנה לוי"
  income: 4200
  amount: 15000
  months: 10
  has_account: true

  monthly: 1500.0
  max_monthly: 1400
  approved_monthly: 1400
  real_months: 10
  last_payment: 1000

  # ההרחבה
  income2: 12000
  amount2: 21000
  months2: 12
  monthly2: 1750.0
  max_monthly2: 4000
  approved_monthly2: 1750.0

notes: >
  **השבוע שבו התוכנית מפסיקה להיות מחשבון של עצמה.** עד כה כל נתון
  היה כתוב בקוד; כאן אותה תוכנית נותנת תשובה אחרת לכל לקוח, והתלמיד
  יכול לשנות את הקלט ולהריץ שוב. ⚠️ **זו גם התשובה לתלונה החוזרת**
  שהמשימות חוזרות על אותה פעולה: כאן אין טקס הדפסה של תשע שורות,
  יש ארבע, והעניין הוא מה התוכנית עושה עם הקלט.

  ⚠️ **‏input() היה מחזיר מחרוזת ריקה עד 2026-11-16.** ‏stdin של
  Pyodide היה מקובע ל-''. השבוע הזה חייב את התשתית: טאב "קלט" בלוח
  התוצאות, ו-stdin שנשאב ממנו. **הבדיקות תמיד רצות על הרשימה
  שלמעלה** ולא על מה שהתלמיד הקליד, אחרת כל ניסוי היה מפיל אותן.

  ⚠️ **שתי מלכודות הטיפוס הן השיעור, לא תופעת לוואי.**
  ‏"5" + "5" נותן "55" ולא 10 — זה מה שמסביר למה ממירים.
  ו-bool("0") הוא True, כי כל מחרוזת לא ריקה היא True; רק
  bool(int("0")) הוא False. **‏has_account הוא בדיוק הבדיקה הזאת**,
  ולכן הוא דורש שתי המרות ולא אחת.

  **הכלל של שליש ההכנסה הוא if שנכתב ב-min.** ‏if מגיע בשבוע 11, וזה
  בדיוק המקום להראות שלא כל הגבלה צריכה תנאי — ושכך זה נכתב בקוד
  אמיתי. ההכנסה 4,200 נבחרה כדי שהתקרה **תיגע**: הלקוחה ביקשה 1,500
  לחודש, מותר לה 1,400, והתוצאה אינה דחייה אלא פריסה של עשרה
  תשלומים ועוד 1,000.

  ⚠️ **ומה שהבדיקות לא תופסות:** ‏max_monthly שחושב כ-income / 3
  במקום //3 נותן 1400.0 במקום 1400, וכל השאר יוצא נכון. הטסטים
  דורשים שלם, ולכן זה כן נתפס — אבל תלמיד שיכתוב int(income / 3)
  יעבור, וזו דרך לגיטימית. **אין כאן קריטריון רובריקה נוסף.**
