week: 13
title: "מחשבון המשכורת v2 — מס מדורג"
status: partial          # רק בלוקי ההוראה. שאר הסכמה חסרה.

context: >
  התלמיד מחליף את המס האחיד 15% שכתב בשבוע 4 בחישוב מדורג.
  **זהו השבוע שבו v2 מוכיח את עצמו — אבל לא בדרך שהובטחה.**

# ====================================================================
# ⚠️ העובדה שקובעת את כל השיחה הזאת
# ====================================================================
the_reversal:
  fact: >
    **נקודת האיזון בין 15% אחיד למדורג היא ברוטו 8,000 בדיוק.**
    מתחתיה המדורג נמוך יותר; מעליה הוא גבוה יותר.

  numbers:
    - "6,000  →  אחיד 900,   מדורג 800     (−100)"
    - "8,000  →  אחיד 1,200, מדורג 1,200   (0)"
    - "9,500  →  אחיד 1,425, מדורג 1,665   (+240)"
    - "11,200 →  אחיד 1,680, מדורג 2,192   (+512)"

  who_is_affected: >
    **רוב הכיתה.** D1 עם ארבע משימות מלאות כבר ב-9,200 ברוטו, ובשבוע
    13 התלמיד הטיפוסי הוא D2 — בסיס 8,000 ועוד תגמול ביצועים.
    **הנטו שלו יירד, והוא יראה את זה בתלוש.**

  what_week_4_promised: >
    ההבטחה המקורית ("המס יירד והנטו יעלה") **תוקנה ב-week-04**.
    מה שמבטיחים שם עכשיו: **שהחישוב ייעשה נכון.** זו הבטחה שמתקיימת.

# ====================================================================
# ההוראה
# ====================================================================
teaches:

  # ------------------------------------------------------------------
  - concept: "העלאה לא יכולה להקטין את הנטו"
    why_now: >
      **זו הזדמנות ההוראה הכי טובה בקורס** (SPEC §3.4), והיא נפתחת
      מעצמה: ברגע שהתלמיד רואה מדרגות, הוא שואל את השאלה.

    the_question: "אז אם אקבל העלאה אפסיד?"

    answer: >
      **לא. השיעור הגבוה חל רק על התוספת.**
      מי שעבר מ-7,900 ל-8,100 משלם 20% על 100 שקלים בלבד —
      לא 20% על הכול. **הכסף שכבר היה שלו נשאר במדרגה שלו.**

    the_demonstration: >
      **לא להסביר — לתת לו להריץ.** לבקש שיחשב את המס על 7,900 ועל
      8,100 עם הפונקציה שכתב, ולהפחית. ההפרש הוא 20 ₪ על 200 ₪
      תוספת. **מספר קטן מרסק אינטואיציה שגויה טוב מכל הסבר.**

    why_it_matters_beyond_the_game: >
      זו האמונה השגויה הנפוצה ביותר על מס הכנסה בישראל, והתלמיד
      ישמע אותה ממבוגרים כל חייו. **הוא ייצא מכאן עם היכולת לסתור
      אותה בדוגמה מספרית.**

  # ------------------------------------------------------------------
  - concept: "הנטו שלך ירד, וזה החישוב הנכון"
    why_now: >
      **הוא יראה את זה בתלוש בין אם נדבר על זה ובין אם לא.**
      עדיף שישמע את זה מאלעד לפני שיראה את המספר.

    say_it_unprompted: >
      **לפני שהוא מגיש, לא אחרי.** בערך:
      "לפני שתריץ — יכול להיות שהמס שלך יעלה. בשכר שלך היום המדורג
      גובה יותר מ-15% האחידים. **המספר הקודם לא היה טוב יותר, הוא
      היה לא נכון.**"

    do_not: >
      ⛔ **לא להתנצל, לא לקרוא לזה 'לא הוגן', ולא להציע פיצוי.**
      ⛔ **לא לומר "בעצם הרווחת"** — הוא לא הרוויח, והוא יודע.

    the_frame: >
      **מדרגות מס גובות יותר ממי שמרוויח יותר. זו כל המטרה שלהן.**
      התלמיד ב-15% האחיד שילם פחות ממה שאדם בשכרו משלם — לא כי
      הוא זכאי, אלא כי המחשבון שלו היה פשוט מדי.

    if_he_pushes: >
      אם הוא טוען שזה עונש על עבודה טובה — **להסכים שזה מרגיש ככה,
      ולהחזיר למספר:** על כל שקל נוסף הוא עדיין לוקח הביתה את הרוב.
      **הוא לא מפסיד מלהרוויח יותר; הוא פשוט מתחלק אחרת.**

# ====================================================================
# מה אסור
# ====================================================================
must_not:
  - "**לא להבטיח שהנטו יעלה.** ההבטחה הזאת הוסרה מ-week-04"
  - "לא להשוות את הנטו שלו לשל תלמיד אחר"
  - "לא לרמוז שהמדרגות של המשחק הן המדרגות של ישראל — הן בהשראתן. ראה SPEC §3.4.1"
  - "לא להיכנס לנקודות זיכוי כאן אם הן כבר נלמדו — הן על המס האמיתי, לא על המשחק"

# ====================================================================
# למורה
# ====================================================================
teacher_note: >
  **צפה לתסכול בשיעור הזה, והוא מוצדק.** התלמידים עבדו על שדרוג
  שהוריד להם את המשכורת. **זה גם השיעור הכי אמיתי בקורס** —
  זו בדיוק החוויה של אדם שמקבל העלאה ורואה שהנטו לא עלה כמו שציפה.

  **מה שהופך את זה מתסכול לשיעור הוא שאלת ההעלאה** (הבלוק הראשון).
  אם היא לא נשאלת מעצמה — לשאול אותה בקול, פרונטלית.
